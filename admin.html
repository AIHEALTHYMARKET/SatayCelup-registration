<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS 活動報名｜管理員後台</title>
<link rel="stylesheet" href="css/manage.css">
</head>
<body>
<main class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">🏓</div>
      <div><h1>BS 活動報名後台</h1><div class="subtitle">活動設定・報名資料管理</div></div>
    </div>
    <div class="top-actions">
      <button class="btn btn-secondary hidden" id="refreshBtn">重新整理</button>
      <button class="btn btn-secondary hidden" id="logoutBtn">登出</button>
    </div>
  </div>

  <!-- 登入 -->
  <section id="loginPanel">
    <div class="login-card">
      <div class="emoji">🔐</div>
      <h2>管理員登入</h2>
      <p>請使用指定的管理員 Google 帳號登入。</p>
      <button class="btn btn-primary" id="loginBtn">使用 Google 登入</button>
      <div class="footer-note">管理員帳號：diabolo.weien@gmail.com</div>
    </div>
  </section>

  <section id="dashboard" class="hidden">
    <div id="messageBox"></div>
    <div id="legacyBox"></div>

    <div class="tabs">
      <button class="tab active" id="tabEvents">📅 活動管理</button>
      <button class="tab" id="tabRegs">📋 報名資料</button>
    </div>

    <!-- ================= 活動列表 ================= -->
    <div id="eventsView">
      <div class="section-card">
        <div class="section-title">
          <div><h2>所有活動</h2><span class="muted">可同時開放多個活動；報名者會在不同分頁看到各自的活動</span></div>
          <button class="btn btn-orange" id="newEventBtn">➕ 新增活動</button>
        </div>
        <div id="eventList"></div>
      </div>
    </div>

    <!-- ================= 活動編輯器 ================= -->
    <div id="editorView" class="hidden">
      <div class="section-card">
        <div class="section-title">
          <h2 id="editorTitle">新增活動</h2>
          <div class="top-actions">
            <button class="btn btn-secondary" id="cancelEditBtn">取消</button>
            <button class="btn btn-primary" id="saveEventBtn">💾 儲存活動</button>
          </div>
        </div>

        <h3>① 基本文案</h3>
        <div class="field"><label>活動名稱 *</label><input id="e_title" placeholder="例如：BS pickleball友誼賽"></div>
        <div class="field"><label>副標題</label><input id="e_subtitle" placeholder="例如：一起打球・一起玩・一起嗨！"></div>
        <div class="field"><label>活動介紹文案</label><textarea id="e_intro" rows="5"></textarea></div>

        <h3>② 照片與影片</h3>
        <div class="field"><label>主視覺圖片連結</label><input id="e_hero" placeholder="https://..."></div>
        <div class="field"><label>其他照片連結（一行一個）</label><textarea id="e_photos" rows="3"></textarea></div>
        <div class="field"><label>影片連結（YouTube / Instagram / Facebook）</label><input id="e_video" placeholder="https://..."></div>

        <h3>③ 活動資訊</h3>
        <div class="field">
          <label>資訊列表（一行一項，格式：標題｜內容）</label>
          <textarea id="e_info" rows="6" placeholder="活動日期｜2026.11.28（星期六）&#10;活動時間｜晚上 7:30 – 10:30&#10;活動地點｜Finz Sports"></textarea>
        </div>

        <h3>④ 費用與繳費</h3>
        <div class="field"><label>報名費文字（沒有可留空）</label><input id="e_fee" placeholder="RM38（包含球衣、場地費）"></div>
        <div class="field"><label>繳費資料文字</label><textarea id="e_payText" rows="3" placeholder="Beneficiary name: ...&#10;Account number: ...&#10;Bank name: ..."></textarea></div>
        <div class="field"><label>繳費資料圖片連結（選填）</label><input id="e_payImg"></div>
        <label class="check"><input type="checkbox" id="e_receipt"> 需要上傳繳費收據（JPG）</label>
        <label class="check"><input type="checkbox" id="e_platinum"> 需要選擇 Platinum（啟用後 Platinum 後台會看到這個活動的資料）</label>
        <div class="field"><label>報名成功訊息（選填）</label><textarea id="e_success" rows="2"></textarea></div>

        <h3>⑤ 報名表單欄位</h3>
        <div class="muted">新增／刪除欄位、設定必填或選填。已有報名資料的欄位請謹慎刪除（舊資料仍會保留，只是不再顯示）。</div>
        <div class="presets" id="presets"></div>
        <div id="fieldList"></div>
        <button class="btn btn-secondary" id="addFieldBtn">➕ 新增自訂欄位</button>

        <h3 style="margin-top:22px">⑥ 狀態</h3>
        <div class="field" style="max-width:300px">
          <select id="e_status">
            <option value="open">🟢 開放報名</option>
            <option value="closed">🔒 鎖定（顯示但不能報名）</option>
            <option value="draft">⚪ 草稿（不公開顯示）</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ================= 報名資料 ================= -->
    <div id="regsView" class="hidden">
      <div class="section-card">
        <div class="section-title">
          <h2>報名資料</h2>
          <div class="field" style="min-width:260px;margin:0">
            <select id="regEventSelect"></select>
          </div>
        </div>

        <div class="stats">
          <div class="stat-card"><div class="stat-label">此活動報名筆數</div><div class="stat-number" id="statTotal">0</div></div>
          <div class="stat-card"><div class="stat-label">所有活動總筆數</div><div class="stat-number" id="statAll">0</div></div>
        </div>
        <div id="fieldStats" style="margin-bottom:14px"></div>

        <div class="filters">
          <div class="field"><label>搜尋</label><input id="regSearch" type="search" placeholder="姓名、Email、電話、任何欄位..."></div>
          <div class="field" id="platinumFilterBox"><label>⭐ Platinum 篩選</label><select id="platinumFilter"></select></div>
        </div>

        <div class="top-actions" style="margin-bottom:14px">
          <button class="btn btn-orange" id="exportBtn">匯出目前活動 CSV</button>
        </div>

        <div class="table-wrap"><table><thead id="regHead"></thead><tbody id="regBody"></tbody></table></div>
        <div class="footer-note">⚠️ 刪除資料前會進行兩次確認，刪除後無法從後台復原。</div>
      </div>
    </div>

  </section>
</main>

<script type="module">
import {
  onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection, getDocs, addDoc, setDoc, updateDoc, deleteDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { auth, db } from "./js/firebase-config.js";
import {
  ADMIN_EMAIL, PLATINUM_UIDS, RESERVED_KEYS, FIELD_TYPES, PRESET_FIELDS, LEGACY_EVENT,
  esc, tsText, newKey, loadEvents, controlHtml, readValues, statsHtml
} from "./js/shared.js";

const $ = id => document.getElementById(id);
let events = [], regs = [], legacyShirts = [];
let editing = null;          // { id|null, fields:[] }
let regEventId = "";

/* ---------- 訊息 ---------- */
function showMessage(text, type = "info") {
  $("messageBox").innerHTML = `<div class="notice notice-${type}">${esc(text)}</div>`;
  setTimeout(() => $("messageBox").innerHTML = "", 5000);
}
const errText = e => e?.message || e?.code || "未知錯誤";

/* ---------- 登入 ---------- */
$("loginBtn").onclick = async () => {
  $("loginBtn").disabled = true;
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { alert("登入失敗：" + errText(e)); }
  $("loginBtn").disabled = false;
};
$("logoutBtn").onclick = () => signOut(auth);
$("refreshBtn").onclick = loadAll;

onAuthStateChanged(auth, async user => {
  const ok = user && user.email === ADMIN_EMAIL;
  if (user && !ok) { await signOut(auth); alert("這個 Google 帳號不是指定管理員帳號。"); return; }
  $("loginPanel").classList.toggle("hidden", !!ok);
  $("dashboard").classList.toggle("hidden", !ok);
  $("logoutBtn").classList.toggle("hidden", !ok);
  $("refreshBtn").classList.toggle("hidden", !ok);
  if (ok) await loadAll();
});

/* ---------- 載入 ---------- */
async function loadAll() {
  try {
    events = await loadEvents(db);
    const rs = await getDocs(collection(db, "registrations"));
    regs = rs.docs.map(d => ({ id: d.id, ...d.data() }));
    regs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    try {
      const ss = await getDocs(collection(db, "shirtOrders"));
      legacyShirts = ss.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch { legacyShirts = []; }

    renderLegacyBox();
    renderEventList();
    renderRegEventSelect();
    renderRegs();
  } catch (e) {
    console.error(e);
    showMessage("資料載入失敗：" + errText(e), "error");
  }
}

/* ---------- 分頁切換 ---------- */
function switchView(v) {
  $("tabEvents").classList.toggle("active", v !== "regs");
  $("tabRegs").classList.toggle("active", v === "regs");
  $("eventsView").classList.toggle("hidden", v !== "events");
  $("editorView").classList.toggle("hidden", v !== "editor");
  $("regsView").classList.toggle("hidden", v !== "regs");
}
$("tabEvents").onclick = () => switchView("events");
$("tabRegs").onclick = () => { renderRegs(); switchView("regs"); };

/* =====================================================
   活動列表
===================================================== */
const STATUS_TEXT = { open: "🟢 開放報名", closed: "🔒 已鎖定", draft: "⚪ 草稿" };

function renderEventList() {
  if (!events.length) {
    $("eventList").innerHTML = `<div class="empty">還沒有任何活動，點右上角「新增活動」開始建立。</div>`;
    return;
  }
  $("eventList").innerHTML = events.map(ev => {
    const n = regs.filter(r => r.eventId === ev.id).length;
    return `<div class="event-card" data-id="${esc(ev.id)}">
      <div class="event-card-head">
        <div>
          <h3>${esc(ev.title || "（未命名）")}</h3>
          <span class="badge badge-${ev.status}">${STATUS_TEXT[ev.status] || ev.status}</span>
          <span class="muted"> ｜ 報名 ${n} 筆 ｜ ${(ev.fields || []).length} 個欄位</span>
        </div>
        <div class="event-card-actions">
          <button class="btn btn-sm ${ev.status === "open" ? "btn-danger" : "btn-primary"}" data-act="toggle">${ev.status === "open" ? "🔒 鎖定報名" : "🟢 開放報名"}</button>
          <button class="btn btn-sm btn-secondary" data-act="view">📋 看報名</button>
          <button class="btn btn-sm btn-secondary" data-act="edit">✏️ 編輯</button>
          <button class="btn btn-sm btn-secondary" data-act="dup">📄 複製</button>
          <button class="btn btn-sm btn-danger" data-act="del">🗑 刪除</button>
        </div>
      </div>
      <div class="muted">報名連結：register.html?event=${esc(ev.id)}</div>
    </div>`;
  }).join("");
}

$("eventList").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.closest("[data-id]").dataset.id;
  const ev = events.find(x => x.id === id);
  const act = btn.dataset.act;

  try {
    if (act === "toggle") {
      const next = ev.status === "open" ? "closed" : "open";
      await updateDoc(doc(db, "events", id), { status: next });
      ev.status = next;
      renderEventList();
      showMessage(`「${ev.title}」已${next === "open" ? "開放" : "鎖定"}報名。`, "success");
    }
    if (act === "view") { regEventId = id; renderRegEventSelect(); renderRegs(); switchView("regs"); }
    if (act === "edit") openEditor(ev);
    if (act === "dup") {
      const { id: _i, ...copy } = ev;
      await addDoc(collection(db, "events"), {
        ...copy, title: ev.title + "（複製）", status: "draft",
        order: Date.now(), createdAt: serverTimestamp()
      });
      showMessage("已複製為草稿活動。", "success");
      await loadAll();
    }
    if (act === "del") {
      const n = regs.filter(r => r.eventId === id).length;
      if (!confirm(`確定刪除活動「${ev.title}」？\n此活動有 ${n} 筆報名資料（報名資料不會被刪除，但會變成未分類）。`)) return;
      if (!confirm("再次確認：真的要刪除這個活動嗎？")) return;
      await deleteDoc(doc(db, "events", id));
      showMessage("活動已刪除。", "success");
      await loadAll();
    }
  } catch (err) { console.error(err); showMessage("操作失敗：" + errText(err), "error"); }
});

$("newEventBtn").onclick = () => openEditor(null);

/* =====================================================
   活動編輯器
===================================================== */
function openEditor(ev) {
  editing = {
    id: ev?.id || null,
    fields: JSON.parse(JSON.stringify(ev?.fields || [
      { ...PRESET_FIELDS[0] }, { ...PRESET_FIELDS[1] }
    ]))
  };
  $("editorTitle").textContent = ev ? "編輯活動：" + ev.title : "新增活動";
  $("e_title").value = ev?.title || "";
  $("e_subtitle").value = ev?.subtitle || "";
  $("e_intro").value = ev?.intro || "";
  $("e_hero").value = ev?.heroImage || "";
  $("e_photos").value = (ev?.photos || []).join("\n");
  $("e_video").value = ev?.video || "";
  $("e_info").value = (ev?.infoItems || []).map(i => `${i.label}｜${i.value}`).join("\n");
  $("e_fee").value = ev?.fee || "";
  $("e_payText").value = ev?.paymentText || "";
  $("e_payImg").value = ev?.paymentImage || "";
  $("e_receipt").checked = !!ev?.receiptRequired;
  $("e_platinum").checked = !!ev?.platinumEnabled;
  $("e_success").value = ev?.successMessage || "";
  $("e_status").value = ev?.status || "draft";
  renderPresets();
  renderFieldList();
  switchView("editor");
  window.scrollTo({ top: 0 });
}
$("cancelEditBtn").onclick = () => switchView("events");

function renderPresets() {
  $("presets").innerHTML = `<span class="muted" style="align-self:center">快速加入常用欄位：</span>` +
    PRESET_FIELDS.map((p, i) => {
      const has = editing.fields.some(f => f.key === p.key);
      return `<button class="btn btn-sm btn-secondary" data-preset="${i}" ${has ? "disabled" : ""}>＋ ${esc(p.label)}</button>`;
    }).join("");
}
$("presets").addEventListener("click", e => {
  const b = e.target.closest("[data-preset]");
  if (!b) return;
  editing.fields.push(JSON.parse(JSON.stringify(PRESET_FIELDS[+b.dataset.preset])));
  renderPresets(); renderFieldList();
});

function renderFieldList() {
  $("fieldList").innerHTML = editing.fields.map((f, i) => `
    <div class="frow" data-i="${i}">
      <div class="frow-top">
        <input data-p="label" value="${esc(f.label)}" placeholder="欄位名稱（報名者看到的標題）">
        <select data-p="type">${Object.entries(FIELD_TYPES).map(([k, v]) => `<option value="${k}" ${f.type === k ? "selected" : ""}>${v}</option>`).join("")}</select>
        <label class="check" style="margin:0;white-space:nowrap"><input type="checkbox" data-p="required" ${f.required ? "checked" : ""}> 必填</label>
        <div class="frow-btns">
          <button class="btn btn-sm btn-secondary" data-mv="-1">↑</button>
          <button class="btn btn-sm btn-secondary" data-mv="1">↓</button>
          <button class="btn btn-sm btn-danger" data-rm="1">✕</button>
        </div>
      </div>
      ${(f.type === "select" || f.type === "radio") ? `<input data-p="options" value="${esc((f.options || []).join(", "))}" placeholder="選項，用逗號分隔，例如：S, M, L, XL">` : `<input data-p="placeholder" value="${esc(f.placeholder || "")}" placeholder="輸入提示文字（選填）">`}
      <div class="frow-key">欄位代碼：${esc(f.key)}</div>
    </div>`).join("") || `<div class="empty">尚未有任何欄位</div>`;
}

$("addFieldBtn").onclick = () => {
  editing.fields.push({ key: newKey(), label: "", type: "text", required: false });
  renderPresets(); renderFieldList();
};

$("fieldList").addEventListener("input", e => {
  const p = e.target.dataset.p;
  if (!p) return;
  const f = editing.fields[+e.target.closest("[data-i]").dataset.i];
  if (p === "required") f.required = e.target.checked;
  else if (p === "options") f.options = e.target.value.split(/[,，\n]/).map(s => s.trim()).filter(Boolean);
  else f[p] = e.target.value;
});
$("fieldList").addEventListener("change", e => {
  if (e.target.dataset.p === "type") renderFieldList();
});
$("fieldList").addEventListener("click", e => {
  const row = e.target.closest("[data-i]");
  if (!row) return;
  const i = +row.dataset.i;
  const mv = e.target.closest("[data-mv]");
  if (mv) {
    const j = i + +mv.dataset.mv;
    if (j < 0 || j >= editing.fields.length) return;
    [editing.fields[i], editing.fields[j]] = [editing.fields[j], editing.fields[i]];
    renderFieldList();
  }
  if (e.target.closest("[data-rm]")) {
    if (!confirm("確定刪除這個欄位？")) return;
    editing.fields.splice(i, 1);
    renderPresets(); renderFieldList();
  }
});

$("saveEventBtn").onclick = async () => {
  const title = $("e_title").value.trim();
  if (!title) return alert("請輸入活動名稱。");

  const keys = new Set();
  for (const f of editing.fields) {
    if (!f.label.trim()) return alert("有欄位沒有填寫名稱。");
    if (RESERVED_KEYS.includes(f.key)) return alert(`欄位代碼「${f.key}」是系統保留字，請刪除後重新新增。`);
    if (keys.has(f.key)) return alert(`欄位代碼「${f.key}」重複。`);
    keys.add(f.key);
    if ((f.type === "select" || f.type === "radio") && !(f.options || []).length) {
      return alert(`欄位「${f.label}」需要填寫選項。`);
    }
  }

  const infoItems = $("e_info").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.split(/[｜|]/);
    return m.length > 1 ? { label: m[0].trim(), value: m.slice(1).join("｜").trim() } : { label: "", value: l };
  });

  const data = {
    title,
    subtitle: $("e_subtitle").value.trim(),
    intro: $("e_intro").value.trim(),
    heroImage: $("e_hero").value.trim(),
    photos: $("e_photos").value.split("\n").map(s => s.trim()).filter(Boolean),
    video: $("e_video").value.trim(),
    infoItems,
    fee: $("e_fee").value.trim(),
    paymentText: $("e_payText").value.trim(),
    paymentImage: $("e_payImg").value.trim(),
    receiptRequired: $("e_receipt").checked,
    platinumEnabled: $("e_platinum").checked,
    successMessage: $("e_success").value.trim(),
    status: $("e_status").value,
    fields: editing.fields.map(f => {
      const o = { key: f.key, label: f.label.trim(), type: f.type, required: !!f.required };
      if (f.type === "select" || f.type === "radio") o.options = f.options || [];
      else if (f.placeholder) o.placeholder = f.placeholder;
      return o;
    })
  };

  $("saveEventBtn").disabled = true;
  try {
    if (editing.id) {
      await updateDoc(doc(db, "events", editing.id), data);
    } else {
      await addDoc(collection(db, "events"), { ...data, order: Date.now(), createdAt: serverTimestamp() });
    }
    showMessage("活動已儲存。", "success");
    await loadAll();
    switchView("events");
  } catch (e) {
    console.error(e);
    alert("儲存失敗：" + errText(e) + "\n請確認 Firestore Rules 已允許管理員寫入 events。");
  }
  $("saveEventBtn").disabled = false;
};

/* =====================================================
   報名資料
===================================================== */
function getRegEvent() {
  if (regEventId === LEGACY_EVENT.id) return LEGACY_EVENT;
  return events.find(e => e.id === regEventId) || null;
}

function legacyRegs() { return regs.filter(r => !r.eventId); }

function renderRegEventSelect() {
  const opts = events.map(e => `<option value="${esc(e.id)}">${esc(e.title)}（${regs.filter(r => r.eventId === e.id).length}）</option>`);
  if (legacyRegs().length) opts.push(`<option value="${LEGACY_EVENT.id}">⚠️ 未分類舊資料（${legacyRegs().length}）</option>`);
  $("regEventSelect").innerHTML = opts.join("") || `<option value="">（尚無活動）</option>`;
  if (!events.some(e => e.id === regEventId) && regEventId !== LEGACY_EVENT.id) regEventId = events[0]?.id || "";
  $("regEventSelect").value = regEventId;
}
$("regEventSelect").onchange = () => { regEventId = $("regEventSelect").value; $("platinumFilter").value = ""; renderRegs(); };
$("regSearch").oninput = renderRegs;
$("platinumFilter").onchange = renderRegs;

function currentRegs() {
  const ev = getRegEvent();
  if (!ev) return [];
  const list = ev.id === LEGACY_EVENT.id ? legacyRegs() : regs.filter(r => r.eventId === ev.id);
  const kw = $("regSearch").value.trim().toLowerCase();
  const pf = $("platinumFilter").value;
  return list.filter(r => {
    if (pf && r.platinum !== pf) return false;
    if (!kw) return true;
    const text = [r.email, r.googleName, r.platinum, ...(ev.fields || []).map(f => r[f.key])].join(" ").toLowerCase();
    return text.includes(kw);
  });
}

function renderRegs() {
  const ev = getRegEvent();
  $("statAll").textContent = regs.length;
  if (!ev) {
    $("statTotal").textContent = 0;
    $("fieldStats").innerHTML = "";
    $("regHead").innerHTML = "";
    $("regBody").innerHTML = `<tr><td class="empty">請先建立活動。</td></tr>`;
    return;
  }

  const all = ev.id === LEGACY_EVENT.id ? legacyRegs() : regs.filter(r => r.eventId === ev.id);
  $("statTotal").textContent = all.length;
  $("fieldStats").innerHTML = statsHtml(ev.fields || [], all);

  // Platinum 篩選
  const showPt = ev.platinumEnabled;
  $("platinumFilterBox").classList.toggle("hidden", !showPt);
  if (showPt) {
    const cur = $("platinumFilter").value;
    $("platinumFilter").innerHTML = `<option value="">全部 Platinum</option>` +
      Object.keys(PLATINUM_UIDS).map(n => `<option ${n === cur ? "selected" : ""}>${esc(n)}</option>`).join("");
  }

  const list = currentRegs();
  const fields = ev.fields || [];
  $("regHead").innerHTML = `<tr><th>#</th><th>Google Email</th>` +
    fields.map(f => `<th>${esc(f.label)}</th>`).join("") +
    (showPt ? `<th>Platinum</th>` : "") +
    (ev.receiptRequired ? `<th>收據</th>` : "") +
    `<th>報名時間</th><th>操作</th></tr>`;

  if (!list.length) {
    $("regBody").innerHTML = `<tr><td colspan="${fields.length + 6}" class="empty">目前沒有符合條件的報名資料。</td></tr>`;
    return;
  }

  $("regBody").innerHTML = list.map((r, i) => `
    <tr data-id="${esc(r.id)}">
      <td>${i + 1}</td>
      <td class="readonly">${esc(r.email || "")}</td>
      ${fields.map(f => `<td>${controlHtml(f, r[f.key], "cell")}</td>`).join("")}
      ${showPt ? `<td><select name="__platinum"><option value="">未選</option>${Object.keys(PLATINUM_UIDS).map(n => `<option ${r.platinum === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></td>` : ""}
      ${ev.receiptRequired ? `<td>${r.receiptDriveUrl ? `<a href="${esc(r.receiptDriveUrl)}" target="_blank" rel="noopener">查看</a>` : "—"}</td>` : ""}
      <td class="readonly">${esc(tsText(r.createdAt))}</td>
      <td><div class="row-actions">
        <button class="btn btn-sm btn-primary" data-act="save">儲存</button>
        <button class="btn btn-sm btn-secondary" data-act="reset">還原</button>
        <button class="btn btn-sm btn-danger" data-act="delete">🗑 刪除</button>
      </div></td>
    </tr>`).join("");
}

$("regBody").addEventListener("click", async e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const tr = btn.closest("tr");
  const id = tr.dataset.id;
  const r = regs.find(x => x.id === id);
  const ev = getRegEvent();
  if (!r || !ev) return;

  if (btn.dataset.act === "reset") return renderRegs();

  if (btn.dataset.act === "save") {
    const data = readValues(tr, ev.fields || []);
    if (ev.platinumEnabled) {
      const pt = tr.querySelector('[name="__platinum"]')?.value || "";
      data.platinum = pt;
      data.platinumUid = PLATINUM_UIDS[pt] || "";
    }
    try {
      await updateDoc(doc(db, "registrations", id), data);
      Object.assign(r, data);
      renderRegs();
      showMessage("資料已成功儲存。", "success");
    } catch (err) { showMessage("儲存失敗：" + errText(err), "error"); }
  }

  if (btn.dataset.act === "delete") {
    const label = (ev.fields?.[0] && r[ev.fields[0].key]) || r.email || "未命名";
    if (!confirm(`⚠️ 第一次確認\n\n即將刪除「${ev.title}」的報名資料：\n${label}\n${r.email || ""}\n\n刪除後無法復原，確定繼續嗎？`)) return;
    if (!confirm("🚨 第二次確認\n\n真的要永久刪除嗎？按「確定」才會刪除。")) return;
    try {
      await deleteDoc(doc(db, "registrations", id));
      regs = regs.filter(x => x.id !== id);
      renderEventList(); renderRegEventSelect(); renderRegs(); renderLegacyBox();
      showMessage("資料已刪除。", "success");
    } catch (err) { showMessage("刪除失敗：" + errText(err), "error"); }
  }
});

/* ---------- CSV ---------- */
$("exportBtn").onclick = () => {
  const ev = getRegEvent();
  if (!ev) return;
  const fields = ev.fields || [];
  const header = ["Google Email", ...fields.map(f => f.label)];
  if (ev.platinumEnabled) header.push("Platinum");
  if (ev.receiptRequired) header.push("收據連結");
  header.push("報名時間");
  const rows = [header, ...currentRegs().map(r => {
    const row = [r.email, ...fields.map(f => r[f.key])];
    if (ev.platinumEnabled) row.push(r.platinum);
    if (ev.receiptRequired) row.push(r.receiptDriveUrl);
    row.push(tsText(r.createdAt));
    return row;
  })];
  const csv = "\uFEFF" + rows.map(row => row.map(v => `"${String(v ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  a.download = `${ev.title}-報名資料.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
};

/* =====================================================
   舊資料遷移（舊 registrations / shirtOrders → 指定活動）
===================================================== */
function renderLegacyBox() {
  const nReg = legacyRegs().length, nShirt = legacyShirts.length;
  if (!nReg && !nShirt) { $("legacyBox").innerHTML = ""; return; }
  const opts = events.map(e => `<option value="${esc(e.id)}">${esc(e.title)}</option>`).join("");
  $("legacyBox").innerHTML = `
    <div class="notice notice-warning">
      <b>⚠️ 發現舊資料尚未歸入活動</b>：舊「出席報名」${nReg} 筆、舊「只買衣服」${nShirt} 筆。<br>
      ${events.length ? `
      <div class="row2" style="margin-top:10px">
        ${nReg ? `<div>舊出席報名 → <select id="mgReg" style="width:100%;padding:8px">${opts}</select></div>` : "<div></div>"}
        ${nShirt ? `<div>舊只買衣服 → <select id="mgShirt" style="width:100%;padding:8px">${opts}</select></div>` : "<div></div>"}
      </div>
      <button class="btn btn-primary" style="margin-top:10px" id="migrateBtn">一鍵歸入所選活動</button>
      <div class="muted" style="margin-top:6px">建議先建立好對應活動（可用欄位「快速加入常用欄位」，代碼與舊資料相同，資料會自動對上）。</div>
      ` : "請先建立活動再遷移。"}
    </div>`;
  $("migrateBtn")?.addEventListener("click", migrate);
}

async function migrate() {
  const regTarget = $("mgReg")?.value, shirtTarget = $("mgShirt")?.value;
  const t = id => events.find(e => e.id === id);
  if (!confirm("確定要遷移舊資料嗎？\n舊「只買衣服」會複製到 registrations 並從 shirtOrders 移除。")) return;
  $("migrateBtn").disabled = true;
  try {
    let n = 0;
    if (regTarget) {
      for (const r of legacyRegs()) {
        await updateDoc(doc(db, "registrations", r.id), { eventId: regTarget, eventTitle: t(regTarget).title });
        n++;
      }
    }
    if (shirtTarget) {
      for (const s of legacyShirts) {
        const { id, ...data } = s;
        if (data.shirtBack && !data.shirtText) data.shirtText = data.shirtBack;
        await setDoc(doc(db, "registrations", id), { ...data, eventId: shirtTarget, eventTitle: t(shirtTarget).title });
        await deleteDoc(doc(db, "shirtOrders", id));
        n++;
      }
    }
    showMessage(`已遷移 ${n} 筆舊資料。`, "success");
    await loadAll();
  } catch (e) {
    console.error(e);
    showMessage("遷移失敗：" + errText(e), "error");
    $("migrateBtn").disabled = false;
  }
}
</script>
