<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SatayCelup之戰｜管理員後台</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                Arial,
                sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .container {
            max-width: 1400px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .center {
            text-align: center;
            padding: 70px 20px;
        }

        .login-box {
            max-width: 450px;
            margin: 80px auto;
            background: white;
            padding: 40px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 30px rgba(0,0,0,.08);
        }

        .google-btn {
            border: none;
            background: #4285F4;
            color: white;
            padding: 14px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }

        .logout-btn {
            border: none;
            background: #ef4444;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        #dashboard {
            display: none;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,.05);
        }

        .stat-title {
            color: #6b7280;
            font-size: 13px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        .toolbar {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .toolbar-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }

        #search {
            flex: 1;
            min-width: 250px;
        }

        .blue {
            background: #2563eb;
            color: white;
        }

        .green {
            background: #059669;
            color: white;
        }

        button {
            cursor: pointer;
        }

        .table-box {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1400px;
            border-collapse: collapse;
        }

        th {
            background: #f9fafb;
            padding: 13px;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 13px;
            border-top: 1px solid #eee;
            font-size: 13px;
        }

        .badge {
            background: #eef2ff;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
        }

        .delete {
            border: none;
            background: #fee2e2;
            color: #b91c1c;
            padding: 7px 10px;
            border-radius: 7px;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
            white-space: pre-wrap;
        }

        @media(max-width:900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:500px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div>
            <h1>🔥 SatayCelup之戰｜管理員後台</h1>
            <div class="subtitle">
                報名資料管理中心
            </div>
        </div>

        <button
            class="logout-btn"
            id="logoutBtn"
            style="display:none;"
        >
            登出
        </button>

    </div>
</header>


<!-- ========================= -->
<!-- 載入中 -->
<!-- ========================= -->

<div id="loading" class="center">

    <div style="font-size:40px;">🔄</div>

    <h3>正在確認管理員登入狀態...</h3>

    <p style="color:#777;">
        請稍候
    </p>

</div>


<!-- ========================= -->
<!-- 登入 -->
<!-- ========================= -->

<div id="loginBox" class="login-box" style="display:none;">

    <div style="font-size:50px;">🔐</div>

    <h2>管理員登入</h2>

    <p style="color:#666;">
        請使用活動管理員 Google 帳號登入
    </p>

    <p style="font-size:13px;color:#888;">
        diabolo.weien@gmail.com
    </p>

    <br>

    <button
        class="google-btn"
        id="loginBtn"
    >
        使用 Google 登入
    </button>

    <div id="loginError"></div>

</div>


<!-- ========================= -->
<!-- 無權限 -->
<!-- ========================= -->

<div
    id="denied"
    class="login-box"
    style="display:none;"
>

    <div style="font-size:50px;">🚫</div>

    <h2>沒有管理員權限</h2>

    <p>
        目前登入帳號：
    </p>

    <strong id="currentEmail"></strong>

    <p style="color:#777;font-size:13px;">
        只有活動管理員可以進入此頁面。
    </p>

    <button
        class="logout-btn"
        id="deniedLogout"
    >
        登出
    </button>

</div>


<!-- ========================= -->
<!-- Dashboard -->
<!-- ========================= -->

<main
    id="dashboard"
    class="container"
>

    <section class="stats">

        <div class="stat">
            <div class="stat-title">
                總報名
            </div>
            <div
                class="stat-number"
                id="total"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                葷食
            </div>
            <div
                class="stat-number"
                id="meat"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                素食
            </div>
            <div
                class="stat-number"
                id="vegetarian"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                羽球
            </div>
            <div
                class="stat-number"
                id="badminton"
            >
                0
            </div>
        </div>

        <div class="stat">
            <div class="stat-title">
                Pickleball
            </div>
            <div
                class="stat-number"
                id="pickleball"
            >
                0
            </div>
        </div>

    </section>


    <!-- 搜尋 -->
    <section class="toolbar">

        <div class="toolbar-row">

            <input
                id="search"
                type="text"
                placeholder="🔎 搜尋姓名、IC、電話、Email..."
            >

            <select id="mealFilter">

                <option value="">
                    全部飲食
                </option>

                <option value="葷">
                    葷食
                </option>

                <option value="素">
                    素食
                </option>

            </select>


            <select id="activityFilter">

                <option value="">
                    全部活動
                </option>

                <option value="羽球">
                    羽球
                </option>

                <option value="pickleball">
                    Pickleball
                </option>

                <option value="觀眾">
                    觀眾
                </option>

            </select>


            <select id="sizeFilter">

                <option value="">
                    全部尺寸
                </option>

                <option>XS</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
                <option>XXL</option>
                <option>XXXL</option>

            </select>


            <button
                class="blue"
                id="refresh"
            >
                🔄 重新整理
            </button>


            <button
                class="green"
                id="export"
            >
                📥 匯出 CSV
            </button>

        </div>

    </section>


    <!-- 表格 -->
    <section class="table-box">

        <table>

            <thead>

                <tr>

                    <th>#</th>
                    <th>姓名</th>
                    <th>Email</th>
                    <th>IC Number</th>
                    <th>電話</th>
                    <th>飲食</th>
                    <th>衣服</th>
                    <th>背後文字</th>
                    <th>活動</th>
                    <th>Partner Group</th>
                    <th>Partner</th>
                    <th>Platinum</th>
                    <th>收據</th>
                    <th>報名時間</th>
                    <th>操作</th>

                </tr>

            </thead>

            <tbody id="tableBody"></tbody>

        </table>

        <div
            id="empty"
            style="
                padding:50px;
                text-align:center;
                color:#777;
                display:none;
            "
        >
            目前沒有資料
        </div>

    </section>

</main>


<script type="module">

    // =========================
    // Firebase
    // =========================

    import {
        onAuthStateChanged,
        signInWithPopup,
        GoogleAuthProvider,
        signOut
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
        collection,
        getDocs,
        deleteDoc,
        doc
    }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    import {
        auth,
        db
    }
    from "./js/firebase-config.js";


    // =========================
    // 管理員
    // =========================

    const ADMIN_EMAIL =
        "diabolo.weien@gmail.com";


    let registrations = [];


    // =========================
    // 元素
    // =========================

    const loading =
        document.getElementById("loading");

    const loginBox =
        document.getElementById("loginBox");

    const denied =
        document.getElementById("denied");

    const dashboard =
        document.getElementById("dashboard");

    const logoutBtn =
        document.getElementById("logoutBtn");


    // =========================
    // 顯示登入
    // =========================

    function showLogin() {

        loading.style.display = "none";

        loginBox.style.display = "block";

        denied.style.display = "none";

        dashboard.style.display = "none";

        logoutBtn.style.display = "none";

    }


    // =========================
    // 登入
    // =========================

    document
        .getElementById("loginBtn")
        .addEventListener("click", async () => {

            const button =
                document.getElementById("loginBtn");

            const errorBox =
                document.getElementById("loginError");


            button.disabled = true;

            button.textContent =
                "正在登入...";

            errorBox.innerHTML = "";


            try {

                const provider =
                    new GoogleAuthProvider();

                await signInWithPopup(
                    auth,
                    provider
                );

            } catch (error) {

                console.error(error);

                errorBox.innerHTML = `
                    <div class="error">
                        Google 登入失敗：

                        ${escapeHtml(error.message)}
                    </div>
                `;

                button.disabled = false;

                button.textContent =
                    "使用 Google 登入";

            }

        });


    // =========================
    // Auth 狀態
    // =========================

    onAuthStateChanged(
        auth,
        async (user) => {

            console.log(
                "Firebase Auth 狀態：",
                user
            );


            if (!user) {

                showLogin();

                return;

            }


            console.log(
                "目前登入 Email：",
                user.email
            );


            // =====================
            // 管理員檢查
            // =====================

            if (
                user.email
                    .toLowerCase()
                !==
                ADMIN_EMAIL
                    .toLowerCase()
            ) {

                loading.style.display =
                    "none";

                loginBox.style.display =
                    "none";

                dashboard.style.display =
                    "none";

                denied.style.display =
                    "block";

                document
                    .getElementById(
                        "currentEmail"
                    )
                    .textContent =
                    user.email || "未知";

                logoutBtn.style.display =
                    "none";

                return;

            }


            // =====================
            // 管理員成功
            // =====================

            loading.style.display =
                "none";

            loginBox.style.display =
                "none";

            denied.style.display =
                "none";

            dashboard.style.display =
                "block";

            logoutBtn.style.display =
                "block";


            await loadData();

        }
    );


    // =========================
    // Auth 逾時保護
    // =========================

    setTimeout(() => {

        if (
            loading.style.display !==
            "none"
        ) {

            console.log(
                "Firebase Auth 等待時間過長，顯示登入畫面"
            );

            showLogin();

        }

    }, 5000);


    // =========================
    // 讀取資料
    // =========================

    async function loadData() {

        try {

            console.log(
                "開始讀取 registrations..."
            );


            const snapshot =
                await getDocs(
                    collection(
                        db,
                        "registrations"
                    )
                );


            registrations = [];


            snapshot.forEach(
                (item) => {

                    registrations.push({

                        id: item.id,

                        ...item.data()

                    });

                }
            );


            console.log(
                "成功讀取：",
                registrations.length,
                "筆"
            );


            updateStats();

            render();


        } catch (error) {

            console.error(error);

            dashboard.innerHTML = `

                <div class="error">

                    ❌ 讀取報名資料失敗

                    ${escapeHtml(
                        error.message
                    )}

                    <br><br>

                    請檢查 Firebase Firestore Rules。

                </div>

            `;

        }

    }


    // =========================
    // 統計
    // =========================

    function updateStats() {

        document.getElementById("total")
            .textContent =
            registrations.length;


        document.getElementById("meat")
            .textContent =
            registrations.filter(
                x => x.meal === "葷"
            ).length;


        document.getElementById("vegetarian")
            .textContent =
            registrations.filter(
                x => x.meal === "素"
            ).length;


        document.getElementById("badminton")
            .textContent =
            registrations.filter(
                x => x.participation === "羽球"
            ).length;


        document.getElementById("pickleball")
            .textContent =
            registrations.filter(
                x =>
                    x.participation ===
                    "pickleball"
                    ||
                    x.participation ===
                    "Pickleball"
            ).length;

    }


    // =========================
    // 篩選
    // =========================

    function filteredData() {

        const keyword =
            document
                .getElementById("search")
                .value
                .trim()
                .toLowerCase();


        const meal =
            document
                .getElementById("mealFilter")
                .value;


        const activity =
            document
                .getElementById("activityFilter")
                .value;


        const size =
            document
                .getElementById("sizeFilter")
                .value;


        return registrations.filter(
            item => {

                const text = [

                    item.email,
                    item.icName,
                    item.icNumber,
                    item.chineseName,
                    item.phone,
                    item.shirtBack,
                    item.partnerGroup,
                    item.partner,
                    item.platinum

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return (

                    (
                        !keyword ||
                        text.includes(keyword)
                    )

                    &&

                    (
                        !meal ||
                        item.meal === meal
                    )

                    &&

                    (
                        !activity ||
                        item.participation ===
                        activity
                    )

                    &&

                    (
                        !size ||
                        item.shirtSize === size
                    )

                );

            }
        );

    }


    // =========================
    // 顯示表格
    // =========================

    function render() {

        const body =
            document.getElementById(
                "tableBody"
            );


        const empty =
            document.getElementById(
                "empty"
            );


        body.innerHTML = "";


        const data =
            filteredData();


        if (!data.length) {

            empty.style.display =
                "block";

            return;

        }


        empty.style.display =
            "none";


        data.forEach(
            (item, index) => {

const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>

                        <strong>
                            ${escapeHtml(
                                item.chineseName ||
                                "-"
                            )}
                        </strong>

                        <br>

                        <small>
                            ${escapeHtml(
                                item.icName ||
                                ""
                            )}
                        </small>

                    </td>

                    <td>
                        ${escapeHtml(
                            item.email || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.icNumber || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.phone || "-"
                        )}
                    </td>

                    <td>

                        <span class="badge">
                            ${escapeHtml(
                                item.meal || "-"
                            )}
                        </span>

                    </td>

                    <td>
                        ${escapeHtml(
                            item.shirtSize || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.shirtBack || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.participation || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.partnerGroup || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.partner || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.platinum || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            item.receiptName || "-"
                        )}
                    </td>

                    <td>
                        ${formatTime(
                            item.createdAt
                        )}
                    </td>

                    <td>

                        <button
                            class="delete"
                            data-id="${item.id}"
                        >
                            🗑️ 刪除
                        </button>

                    </td>

                `;


                body.appendChild(row);

            }
        );


        document
            .querySelectorAll(".delete")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        deleteRegistration(
                            button.dataset.id
                        );

                    }
                );

            });

    }


    // =========================
    // 刪除
    // =========================

    async function deleteRegistration(
        id
    ) {

        const target =
            registrations.find(
                x => x.id === id
            );


        if (!target) return;


        const name =
            target.chineseName ||
            target.icName ||
            target.email ||
            "這筆資料";


        if (
            !confirm(
                `確定要刪除「${name}」嗎？\n\n刪除後無法復原。`
            )
        ) {

            return;

        }


        try {

            await deleteDoc(
                doc(
                    db,
                    "registrations",
                    id
                )
            );


            alert("刪除成功");


            await loadData();


        } catch (error) {

            console.error(error);

            alert(
                "刪除失敗：\n" +
                error.message
            );

        }

    }


    // =========================
    // CSV
    // =========================

    document
        .getElementById("export")
        .addEventListener(
            "click",
            () => {

                const data =
                    filteredData();


                if (!data.length) {

                    alert(
                        "目前沒有可以匯出的資料"
                    );

                    return;

                }


                const headers = [

                    "姓名",
                    "IC English Name",
                    "Email",
                    "IC Number",
                    "電話",
                    "飲食",
                    "衣服尺寸",
                    "衣服背後文字",
                    "活動",
                    "Partner Group",
                    "Partner",
                    "Platinum",
                    "收據檔名",
                    "報名時間"

                ];


                const rows =
                    data.map(
                        item => [

                            item.chineseName || "",
                            item.icName || "",
                            item.email || "",
                            item.icNumber || "",
                            item.phone || "",
                            item.meal || "",
                            item.shirtSize || "",
                            item.shirtBack || "",
                            item.participation || "",
                            item.partnerGroup || "",
                            item.partner || "",
                            item.platinum || "",
                            item.receiptName || "",
                            formatTime(
                                item.createdAt
                            )

                        ]
                    );


                let csv =
                    "\uFEFF" +
                    headers.join(",") +
                    "\n";


                rows.forEach(row => {

                    csv += row
                        .map(
                            value =>
                                `"${String(
                                    value
                                ).replace(
                                    /"/g,
                                    '""'
                                )}"`
                        )
                        .join(",") +
                        "\n";

                });


                const blob =
                    new Blob(
                        [csv],
                        {
                            type:
                                "text/csv;charset=utf-8;"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href = url;

                a.download =
                    "SatayCelup-registration.csv";

                a.click();


                URL.revokeObjectURL(
                    url
                );

            }
        );


    // =========================
    // 搜尋
    // =========================

    document
        .getElementById("search")
        .addEventListener(
            "input",
            render
        );


    document
        .getElementById("mealFilter")
        .addEventListener(
            "change",
            render
        );


    document
        .getElementById("activityFilter")
        .addEventListener(
            "change",
            render
        );


    document
        .getElementById("sizeFilter")
        .addEventListener(
            "change",
            render
        );


    // =========================
    // 重新整理
    // =========================

    document
        .getElementById("refresh")
        .addEventListener(
            "click",
            loadData
        );


    // =========================
    // 登出
    // =========================

    async function logout() {

        try {

            await signOut(auth);

            location.reload();

        } catch (error) {

            console.error(error);

        }

    }


    document
        .getElementById("logoutBtn")
        .addEventListener(
            "click",
            logout
        );


    document
        .getElementById("deniedLogout")
        .addEventListener(
            "click",
            logout
        );


    // =========================
    // 時間
    // =========================

    function formatTime(timestamp) {

        if (!timestamp) return "-";


        try {

            const date =
                timestamp.toDate
                    ? timestamp.toDate()
                    : new Date(
                        timestamp.seconds * 1000
                    );


            return date.toLocaleString(
                "zh-MY"
            );

        } catch {

            return "-";

        }

    }


    // =========================
    // 防止 HTML 注入
    // =========================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>
