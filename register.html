<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SatayCelup之戰｜活動報名</title>

<style>

/* =========================================
   SATAY CELUP｜清新歡樂時光
========================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    color: #33413a;

    background:
        radial-gradient(circle at 10% 10%, #fff7c9 0, transparent 24%),
        radial-gradient(circle at 90% 15%, #dff7e8 0, transparent 28%),
        linear-gradient(180deg, #f8fff9 0%, #fffaf0 100%);
}


/* =========================================
   裝飾
========================================= */

body::before {
    content: "🍢";
    position: fixed;
    top: 24px;
    left: 18px;
    font-size: 32px;
    opacity: 0.16;
    transform: rotate(-12deg);
    pointer-events: none;
}

body::after {
    content: "☀️";
    position: fixed;
    right: 18px;
    bottom: 25px;
    font-size: 34px;
    opacity: 0.18;
    pointer-events: none;
}


/* =========================================
   主容器
========================================= */

.container {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 22px 16px 50px;
}


/* =========================================
   Hero
========================================= */

.hero {
    position: relative;

    background: rgba(255,255,255,0.9);

    border: 1px solid rgba(119,157,128,0.15);

    border-radius: 30px;

    padding: 30px 22px 35px;

    box-shadow:
        0 15px 45px rgba(65,100,75,0.10);

    overflow: hidden;
}

.hero::before {
    content: "";
    position: absolute;

    width: 180px;
    height: 180px;

    top: -90px;
    right: -70px;

    background: #e8f7d9;

    border-radius: 50%;

    opacity: 0.7;
}

.hero::after {
    content: "";
    position: absolute;

    width: 130px;
    height: 130px;

    bottom: -75px;
    left: -55px;

    background: #fff1ad;

    border-radius: 50%;

    opacity: 0.65;
}


/* =========================================
   標籤
========================================= */

.badge {
    position: relative;
    z-index: 2;

    display: inline-block;

    padding: 7px 14px;

    background: #e8f7dc;

    color: #4f805b;

    border-radius: 30px;

    font-size: 12px;
    font-weight: 800;

    letter-spacing: 1.5px;

    margin-bottom: 13px;
}


/* =========================================
   標題
========================================= */

h1 {
    position: relative;
    z-index: 2;

    margin: 0;

    font-size: clamp(32px, 8vw, 48px);

    line-height: 1.15;

    font-weight: 900;

    letter-spacing: -1px;

    color: #315b42;
}

.subtitle {
    position: relative;
    z-index: 2;

    margin: 10px 0 25px;

    font-size: 16px;

    color: #748078;

    line-height: 1.7;
}

.subtitle::after {
    content: "  一起吃・一起玩・一起嗨！";

    color: #e29a38;

    font-weight: 700;
}


/* =========================================
   Loading
========================================= */

.loading-message {
    position: relative;
    z-index: 3;

    padding: 20px;

    background: #f5faf5;

    border-radius: 18px;

    text-align: center;

    color: #64736a;

    line-height: 1.7;
}


/* =========================================
   Google Email
========================================= */

.form-group:first-child {
    background: #f3faf4;

    border: 1px solid #e2eee3;

    border-radius: 18px;

    padding: 15px 16px;

    margin-bottom: 20px;
}

.form-group:first-child label {
    color: #5f7766;
}

.form-group:first-child input {
    background: transparent;
    border: none;
    padding: 4px 0 0;

    color: #54705c;

    font-weight: 600;
}


/* =========================================
   表單區塊
========================================= */

#formContainer {
    position: relative;
    z-index: 3;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 800;

    color: #46564c;
}

.form-group label::first-letter {
    color: #5b9b68;
}


/* =========================================
   Input / Select
========================================= */

input,
select {
    width: 100%;

    min-height: 50px;

    padding: 12px 15px;

    border: 1.5px solid #dce7de;

    border-radius: 14px;

    background: #ffffff;

    color: #34443a;

    font-size: 15px;

    outline: none;

    transition:
        border-color 0.2s,
        box-shadow 0.2s,
        transform 0.2s;
}

input:focus,
select:focus {
    border-color: #78ae82;

    box-shadow:
        0 0 0 4px rgba(120,174,130,0.12);

    transform: translateY(-1px);
}

input::placeholder {
    color: #a9b2ab;
}


/* =========================================
   Select
========================================= */

select {
    appearance: auto;

    cursor: pointer;
}


/* =========================================
   File
========================================= */

input[type="file"] {
    padding: 10px;

    background: #fbfdfb;

    cursor: pointer;
}

input[type="file"]::file-selector-button {
    border: none;

    padding: 9px 13px;

    margin-right: 10px;

    border-radius: 10px;

    background: #e8f5df;

    color: #4d7657;

    font-weight: 700;

    cursor: pointer;
}


/* =========================================
   Section 視覺分組
========================================= */

#registrationForm {
    position: relative;
}


/* 第一組：基本資料 */
#registrationForm .form-group:nth-child(2),
#registrationForm .form-group:nth-child(3),
#registrationForm .form-group:nth-child(4),
#registrationForm .form-group:nth-child(5) {
    background: #fffdf7;

    padding: 14px;

    border-radius: 18px;

    border: 1px solid #f1ead7;
}


/* =========================================
   特別提示
========================================= */

#registrationForm::before {
    content: "👋 先填寫參加者資料";

    display: block;

    margin: 5px 0 15px;

    color: #64816b;

    font-size: 16px;

    font-weight: 900;
}


/* =========================================
   Submit Button
========================================= */

.primary-btn {
    width: 100%;

    min-height: 52px;

    margin-top: 12px;

    border: none;

    border-radius: 16px;

    background:
        linear-gradient(
            135deg,
            #67a873,
            #4d9360
        );

    color: white;

    font-size: 16px;

    font-weight: 900;

    letter-spacing: 0.5px;

    cursor: pointer;

    box-shadow:
        0 8px 18px rgba(78,143,91,0.20);

    transition:
        transform 0.2s,
        box-shadow 0.2s,
        opacity 0.2s;
}

.primary-btn:hover {
    transform: translateY(-2px);

    box-shadow:
        0 11px 24px rgba(78,143,91,0.25);
}

.primary-btn:active {
    transform: translateY(0);
}

.primary-btn:disabled {
    opacity: 0.55;

    cursor: not-allowed;

    transform: none;
}


/* =========================================
   提交按鈕特別設計
========================================= */

#submitBtn {
    margin-top: 12px;

    min-height: 58px;

    font-size: 17px;

    background:
        linear-gradient(
            135deg,
            #f0ad45,
            #e69132
        );

    box-shadow:
        0 10px 22px rgba(230,145,50,0.22);
}

#submitBtn::first-letter {
    font-size: 20px;
}


/* =========================================
   Message
========================================= */

.status {
    min-height: 24px;

    margin: 14px 4px;

    text-align: center;

    font-size: 14px;

    line-height: 1.6;
}


/* =========================================
   登出
========================================= */

#logoutBtn {
    margin-top: 20px;

    background: #edf2ee;

    color: #607066;

    box-shadow: none;

    font-size: 14px;
}

#logoutBtn:hover {
    background: #e4ebe5;

    box-shadow: none;
}


/* =========================================
   SUCCESS
========================================= */

#successContainer {
    display: none;

    position: relative;
    z-index: 5;

    text-align: center;

    padding: 25px 5px 10px;
}

.success-icon {
    width: 92px;
    height: 92px;

    margin: 0 auto 18px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #fff4bd;

    font-size: 48px;

    box-shadow:
        0 10px 30px rgba(229,177,62,0.15);

    animation: bounceIn 0.55s ease;
}

#successContainer h2 {
    margin: 0 0 10px;

    font-size: 30px;

    color: #3e704b;

    font-weight: 900;
}

#successContainer .success-text {
    margin: 0 auto 24px;

    color: #78837c;

    line-height: 1.8;

    font-size: 15px;
}

.success-btn {
    width: 100%;

    min-height: 55px;

    margin: 10px 0;

    border: none;

    border-radius: 16px;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    transition: 0.2s;
}

.success-btn:hover {
    transform: translateY(-2px);
}

.continue-btn {
    background:
        linear-gradient(
            135deg,
            #f0ad45,
            #e28d2c
        );

    color: white;

    box-shadow:
        0 9px 20px rgba(225,142,43,0.20);
}

.home-btn {
    background: #edf4ed;

    color: #55705c;
}

.success-email {
    margin-top: 20px;

    padding: 11px 14px;

    border-radius: 12px;

    background: #f7faf7;

    color: #8a958e;

    font-size: 12px;
}


/* =========================================
   小裝飾
========================================= */

.fun-note {
    margin: 22px 0 8px;

    padding: 13px 15px;

    border-radius: 15px;

    background: #fff8d9;

    color: #8b7441;

    font-size: 13px;

    line-height: 1.6;

    text-align: center;
}


/* =========================================
   動畫
========================================= */

@keyframes bounceIn {

    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    70% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* =========================================
   手機
========================================= */

@media (max-width: 480px) {

    .container {
        padding: 12px 10px 35px;
    }

    .hero {
        padding: 25px 17px 28px;

        border-radius: 25px;
    }

    h1 {
        font-size: 34px;
    }

    .subtitle {
        font-size: 14px;
    }

    input,
    select {
        min-height: 48px;

        font-size: 15px;
    }

    .form-group {
        margin-bottom: 15px;
    }

}


/* =========================================
   Desktop
========================================= */

@media (min-width: 700px) {

    .container {
        padding-top: 45px;
    }

    .hero {
        padding: 42px 42px 45px;
    }

}

</style>

</head>


<body>


<main class="container">


<section class="hero">


    <!-- =====================================
         Header
    ====================================== -->

    <div class="badge">
        ☀️ 2026 EVENT
    </div>


    <h1>
        🍢 SatayCelup之戰
    </h1>


    <p class="subtitle">
        活動報名表
    </p>


    <!-- =====================================
         Login Loading
    ====================================== -->

    <div
        id="loadingMessage"
        class="loading-message">

        正在確認 Google 登入狀態...

    </div>


    <!-- =====================================
         Form
    ====================================== -->

    <div
        id="formContainer"
        style="display:none;">


        <form
            id="registrationForm">


            <!-- Google Email -->

            <div class="form-group">

                <label>
                    📧 Google Email
                </label>

                <input
                    type="email"
                    id="email"
                    readonly>

            </div>


            <!-- IC English Name -->

            <div class="form-group">

                <label>
                    👤 IC English Name *
                </label>

                <input
                    type="text"
                    id="englishName"
                    placeholder="請輸入 IC English Name"
                    required>

            </div>


            <!-- IC Number -->

            <div class="form-group">

                <label>
                    🪪 IC Number *
                </label>

                <input
                    type="text"
                    id="icNumber"
                    placeholder="請輸入 IC Number"
                    required>

            </div>


            <!-- 中文姓名 -->

            <div class="form-group">

                <label>
                    ✨ 中文姓名 / 匿名
                </label>

                <input
                    type="text"
                    id="chineseName"
                    placeholder="可填姓名，也可以填匿名">

            </div>


            <!-- 電話 -->

            <div class="form-group">

                <label>
                    📱 電話 *
                </label>

                <input
                    type="tel"

            <!-- 飲食 -->

            <div class="form-group">

                <label>
                    🍽️ 飲食 *
                </label>

                <select
                    id="meal"
                    required>

                    <option value="">
                        請選擇飲食
                    </option>

                    <option value="葷">
                        🍖 葷
                    </option>

                    <option value="素">

                    </option>

                </select>

            </div>


            <!-- 衣服尺寸 -->

            <div class="form-group">

                <label>
                    👕 衣服尺寸 *
                </label>

                <select
                    id="shirtSize"
                    required>

                    <option value="">
                        請選擇衣服尺寸
                    </option>

                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                    <option value="XXXL">XXXL</option>

                </select>

            </div>


            <!-- 衣服背面 -->

            <div class="form-group">

                <label>
                    👕 衣服背面文字
                </label>

                <input
                    type="text"
                    id="shirtText"
                    placeholder="想印在衣服背面的文字">

            </div>


            <!-- 參與項目 -->

            <div class="form-group">

                <label>
                    🏸 參與項目 *
                </label>

                <select
                    id="participation"
                    required>

                    <option value="">
                        請選擇參與項目
                    </option>

                    <option value="羽球">
                        🏸 羽球
                    </option>

                    <option value="pickleball">
                        🥒 Pickleball
                    </option>

                    <option value="觀眾">
                        👀 觀眾

                </select>

            </div>


            <!-- 球伴組別 -->

            <div class="form-group">

                <label>
                    👥 球伴組別

                <input
                    type="text"

            </div>


            <!-- 球伴 -->

            <div class="form-group">

                <label>
                    👫 球伴
                </label>

                <input
                    type="text"
                    id="partner"
                    placeholder="球伴姓名">

            </div>


            <!-- Platinum -->

            <div class="form-group">

                <label>
                    💎 Platinum
                </label>

                <select
                    id="platinum">

                    <option value="">
                        請選擇 Platinum
                    </option>

                    <option>
                        Sense&Lavenier
                    </option>

                    <option>
                        Amos
                    </option>

                    <option>
                        Sunny
                    </option>

                    <option>
                        Robin&Zoey
                    </option>

                    <option>
                        RyanLio
                    </option>

                    <option>
                        Wyane&Momo
                    </option>

                    <option>
                        Jess
                    </option>

                    <option>
                        Keong&Ngah
                    </option>

                    <option>
                        JayChew
                    </option>

                    <option>
                        Lynn
                    </option>

                    <option>
                        SzeChew
                    </option>

                </select>

            </div>


            <!-- 收據 -->

            <div class="form-group">

                <label>
                    🧾 繳費收據 JPG
                </label>

                <input
                    type="file"
                    id="receipt"
                    accept=".jpg,.jpeg,image/jpeg">

            </div>


            <!-- 提醒 -->

            <div class="fun-note">

                🍢 填好資料後就可以出發！<br>
                如果你要幫朋友報名，也可以提交後繼續幫下一位報名喔！

            </div>


            <!-- Submit -->

            <button
                type="submit"
                id="submitBtn"
                class="primary-btn">

                🎉 提交我的報名

            </button>


            <!-- Message -->

            <p

            </p>


        </form>


        <!-- Logout -->

        <button
            type="button"
            id="logoutBtn"

            Google 登出

        </button>


    </div>


    <!-- =====================================
         Success
    ====================================== -->

    <div
        id="successContainer">


        <div class="success-icon">
            🎉
        </div>


        <h2>
            報名成功！
        </h2>


        <p class="success-text">

            太棒了！這位參加者的資料已經收到啦。<br>

            <strong>SatayCelup之戰見！🍢</strong>

        </p>


        <button
            type="button"
            id="continueBtn"
            class="success-btn continue-btn">

            ➕ 繼續幫其他人報名

        </button>

            type="button"
            id="homeBtn"

        </button>

<script type="module">


/* =========================================
   Firebase Auth
========================================= */

import {

    onAuthStateChanged,

    signOut

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   Firestore
========================================= */

import {

    collection,

    addDoc,

    serverTimestamp

} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   Firebase Config
========================================= */

import {

    auth,

    db

} from "./js/firebase-config.js";


/* =========================================
   HTML Elements
========================================= */

const loadingMessage =
    document.getElementById(
        "loadingMessage"
    );


const formContainer =
    document.getElementById(
        "formContainer"
    );


const successContainer =
    document.getElementById(
        "successContainer"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const form =
    document.getElementById(
        "registrationForm"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const message =
    document.getElementById(
        "message"
    );


const logoutBtn =
    document.getElementById(
        "logoutBtn"
    );


const continueBtn =
    document.getElementById(
        "continueBtn"
    );


const homeBtn =
    document.getElementById(
        "homeBtn"
    );


const successEmail =
    document.getElementById(
        "successEmail"
    );


/* =========================================
   Google Login State
========================================= */

onAuthStateChanged(
    auth,
    (user) => {

        console.log(
            "Auth State:",
            user
        );


        /* ==============================
           未登入
        ============================== */

        if (!user) {

            loadingMessage.innerHTML = `

                尚未登入 Google。

                <br><br>

                <button
                    class="primary-btn"
                    onclick="location.href='index.html'">

                    🏠 回到活動介紹 / Google 登入

                </button>

            `;

            loadingMessage.style.display =
                "block";

            formContainer.style.display =
                "none";

            successContainer.style.display =
                "none";

            return;
        }


        /* ==============================
           已登入
        ============================== */

        console.log(
            "登入成功：",
            user.email
        );


        emailInput.value =
            user.email || "";


        successEmail.textContent =
            "目前登入帳號：" +
            (user.email || "");


        loadingMessage.style.display =
            "none";


        formContainer.style.display =
            "block";


        successContainer.style.display =
            "none";

    }
);


/* =========================================
   Submit Registration
========================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const user =
            auth.currentUser;


        /* ==============================
           Login check
        ============================== */

        if (!user) {

            message.textContent =
                "Google 登入狀態已失效，請重新登入。";

            message.style.color =
                "red";

            return;
        }


        submitBtn.disabled =
            true;


        message.textContent =
            "正在提交報名...";


        message.style.color =
            "#68766d";


        try {


            /* ==========================
               Receipt
            ========================== */

            const receipt =
                document
                    .getElementById(
                        "receipt"
                    )
                    .files[0];


            /* ==========================
               Registration Data
            ========================== */

            const registrationData = {

                email:
                    user.email || "",

                uid:
                    user.uid || "",

                googleName:
                    user.displayName || "",

                englishName:
                    document
                        .getElementById(
                            "englishName"
                        )
                        .value
                        .trim(),

                icNumber:
                    document
                        .getElementById(
                            "icNumber"
                        )
                        .value
                        .trim(),

                chineseName:
                    document
                        .getElementById(
                            "chineseName"
                        )
                        .value
                        .trim(),

                phone:
                    document
                        .getElementById(
                            "phone"
                        )
                        .value
                        .trim(),

                meal:
                    document
                        .getElementById(
                            "meal"
                        )
                        .value,

                shirtSize:
                    document
                        .getElementById(
                            "shirtSize"
                        )
                        .value,

                shirtText:
                    document
                        .getElementById(
                            "shirtText"
                        )
                        .value
                        .trim(),

                participation:
                    document
                        .getElementById(
                            "participation"
                        )
                        .value,

                partnerGroup:
                    document
                        .getElementById(
                            "partnerGroup"
                        )
                        .value
                        .trim(),

                partner:
                    document
                        .getElementById(
                            "partner"
                        )
                        .value
                        .trim(),

                platinum:
                    document
                        .getElementById(
                            "platinum"
                        )
                        .value,

                receiptName:
                    receipt
                        ? receipt.name
                        : "",

                receiptType:
                    receipt
                        ? receipt.type
                        : "",

                receiptSize:
                    receipt
                        ? receipt.size
                        : 0,

                createdAt:
                    serverTimestamp()

            };


            console.log(
                "開始寫入 Firestore：",
                registrationData
            );


            /* ==========================
               Firestore
            ========================== */

            const docRef =
                await addDoc(
                    collection(
                        db,
                        "registrations"
                    ),
                    registrationData
                );


            console.log(
                "Firestore 成功：",
                docRef.id
            );


            /* ==========================
               Success
            ========================== */

            form.reset();


            emailInput.value =
                user.email || "";


            message.textContent =
                "";


            formContainer.style.display =
                "none";


            successContainer.style.display =
                "block";


            successEmail.textContent =
                "目前登入帳號：" +
                (user.email || "");


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


        } catch (error) {


            console.error(
                "Firestore Error:",
                error
            );


            message.textContent =
                "報名失敗：" +
                error.code +
                "｜" +
                error.message;


            message.style.color =
                "red";


        } finally {


            submitBtn.disabled =
                false;

        }

    }
);


/* =========================================
   Continue Register
========================================= */

continueBtn.addEventListener(
    "click",
    () => {


        const user =
            auth.currentUser;


        /* ==============================
           Reset form
        ============================== */

        form.reset();


        /* ==============================
           Keep Google Email
        ============================== */

        if (user) {

            emailInput.value =
                user.email || "";

        }


        message.textContent =
            "";


        message.style.color =
            "";


        /* ==============================
           Show form
        ============================== */

        successContainer.style.display =
            "none";


        formContainer.style.display =
            "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });


        setTimeout(
            () => {

                document
                    .getElementById(
                        "englishName"
                    )
                    .focus();

            },
            300
        );

    }
);


/* =========================================
   Home
========================================= */

homeBtn.addEventListener(
    "click",
    () => {

        location.href =
            "index.html";

    }
);


/* =========================================
   Logout
========================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(
                auth
            );

            location.href =
                "index.html";

        } catch (error) {

            console.error(
                "Logout Error:",
                error
            );

        }

    }
);


</script>
