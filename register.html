<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatayCelup Auth Test</title>
</head>

<body>

<div id="app" style="
    padding:30px;
    font-family:Arial,sans-serif;
    font-size:20px;
">

    🔵 TEST VERSION 2026-09-04-001
    <br><br>
    正在啟動 Firebase...

</div>


<script type="module">

    console.log("========== TEST START ==========");

    const appElement =
        document.getElementById("app");


    try {

        console.log("Step 1: 開始載入 Firebase Auth");


        const {
            onAuthStateChanged
        } =
        await import(
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"
        );


        console.log("Step 2: Firebase Auth SDK 載入成功");


        const {
            auth
        } =
        await import(
            "./js/firebase-config.js?v=20260904001"
        );


        console.log("Step 3: firebase-config 載入成功");


        appElement.innerHTML = `
            🟡 Firebase 已啟動
            <br><br>
            正在等待 Firebase Auth...
        `;


        onAuthStateChanged(
            auth,
            (user) => {

                console.log(
                    "Step 4: onAuthStateChanged",
                    user
                );


                if (user) {

                    appElement.innerHTML = `

                        🟢 <strong>Google 登入成功</strong>

                        <br><br>

                        Email：
                        ${user.email}

                        <br><br>

                        UID：
                        ${user.uid}

                        <br><br>

                        Provider：
                        ${user.providerData
                            .map(x => x.providerId)
                            .join(", ")}

                    `;

                } else {

                    appElement.innerHTML = `

                        🔴 <strong>Firebase 沒有登入</strong>

                        <br><br>

                        onAuthStateChanged 已執行，
                        但 user = null

                    `;

                }

            }

        );


    } catch (error) {

        console.error(
            "========== TEST ERROR ==========",
            error
        );


        appElement.innerHTML = `

            🔴 <strong>JavaScript 發生錯誤</strong>

            <br><br>

            Code：
            ${error.code || "無"}

            <br><br>

            Message：
            ${error.message || error}

        `;

    }

</script>

</body>
</html>
