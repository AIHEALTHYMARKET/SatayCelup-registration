<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SatayCelup之戰｜活動報名</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .form-page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 30px 18px 60px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 36px;
            margin: 15px 0 8px;
        }

        .form-header p {
            color: rgba(255,255,255,0.65);
        }

        .form-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            padding: 28px;
            backdrop-filter: blur(18px);
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .required {
            color: #ff8b8b;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
            color: white;
            font-size: 15px;
            outline: none;
        }

        select option {
            color: #111;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(255,255,255,0.55);
        }

        input:disabled,
        select:disabled,
        textarea:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .readonly {
            opacity: 0.7;
        }

        .event-notice {
            padding: 18px;
            margin-bottom: 25px;
            border-radius: 15px;
            background: rgba(0,0,0,0.2);
            line-height: 1.7;
        }

        .event-notice strong {
            font-size: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: white;
            color: #17120d;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.6;
            word-break: break-word;
        }

        .success-message {
            color: #9ff0b0;
        }

        .error-message {
            color: #ffaaaa;
        }

        .logout-btn {
            margin-top: 18px;
            background: transparent;
            color: rgba(255,255,255,0.65);
            border: none;
            cursor: pointer;
        }

        .logout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .loading-message {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
        }

        .debug-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,0,0,0.08);
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media(max-width:600px) {
            .form-card {
                padding: 20px 16px;
            }

            .form-header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<main class="form-page">

    <header class="form-header">
        <div class="badge">
            2026 EVENT
        </div>

        <h1>SatayCelup之戰</h1>

        <p>
            活動報名表
        </p>
    </header>

    <section class="form-card">

        <div id="loadingMessage" class="loading-message">
            正在確認 Google 登入狀態...
        </div>

        <div id="formContainer" class="hidden">

            <div class="event-notice">
                <div>
                    活動費用：
                    <strong>RM168</strong>
                </div>

                <div>
                    繳費日期：
                    <strong>05/09/2026 - 25/09/2026</strong>
                </div>

                <div style="margin-top:8px;">
                    請確認付款後再提交報名資料。
                </div>
            </div>

            <form id="registrationForm">

                <div class="form-section">

                    <div class="form-section-title">
                        ① 個人資料
                    </div>

                    <div class="form-group">
                        <label>
                            Google Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="readonly"
                            readonly
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            IC上英文姓名
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="englishName"
                            placeholder="請按照 IC 上的英文姓名填寫"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            IC號碼
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="icNumber"
                            placeholder="請輸入 IC 號碼"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            中文名或匿名
                        </label>

                        <input
                            type="text"
                            id="chineseName"
                            placeholder="可填中文姓名，也可以填匿名"
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            聯絡電話
                            <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="例如：0123456789"
                            required
                        >
                    </div>

                </div>

                <div class="form-section">

                    <div class="form-section-title">
                        ② 活動資料
                    </div>

                    <div class="form-group">
                        <label>
                            膳食
                            <span class="required">*</span>
                        </label>

                        <select id="meal" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="葷">
                                葷
                            </option>

                            <option value="素">
                                素
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            衣服尺寸
                            <span class="required">*</span>
                        </label>

                        <select id="shirtSize" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                            <option value="XXXL">XXXL</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            衣服背後文字
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="shirtText"
                            maxlength="30"
                            placeholder="例如：WYANE"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            參與方式
                            <span class="required">*</span>
                        </label>

                        <select id="participation" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="羽球">
                                羽球
                            </option>

                            <option value="pickleball">
                                pickleball
                            </option>

                            <option value="觀眾">
                                觀眾
                            </option>
                        </select>
                    </div>

                    <div
                        class="form-group"
                        id="partnerGroup"
                    >
                        <label>
                            參賽搭檔
                        </label>

                        <input
                            type="text"
                            id="partner"
                            placeholder="請輸入參賽搭檔姓名"
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            白金
                            <span class="required">*</span>
                        </label>

                        <select id="platinum" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="Sense&Lavenier">
                                Sense&Lavenier
                            </option>

                            <option value="Amos">
                                Amos
                            </option>

                            <option value="Sunny">
                                Sunny
                            </option>

                            <option value="Robin&Zoey">
                                Robin&Zoey
                            </option>

                            <option value="RyanLio">
                                RyanLio
                            </option>

                            <option value="Wyane&Momo">
                                Wyane&Momo
                            </option>

                            <option value="Jess">
                                Jess
                            </option>

                            <option value="Keong&Ngah">
                                Keong&Ngah
                            </option>

                            <option value="JayChew">
                                JayChew
                            </option>

                            <option value="Lynn">
                                Lynn
                            </option>

                            <option value="SzeChew">
                                SzeChew
                            </option>
                        </select>
                    </div>

                </div>

                <div class="form-section">

                    <div class="form-section-title">
                        ③ 繳費資料
                    </div>

                    <div class="event-notice">
                        <div>
                            <strong>RM168</strong>
                        </div>

                        <div>
                            有效繳費日期：
                            05/09/2026 至 25/09/2026
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            繳費收據 JPG
                            <span class="required">*</span>
                        </label>

                        <input
                            type="file"
                            id="receipt"
                            accept=".jpg,.jpeg,image/jpeg"
                            required
                        >

                        <small style="display:block;margin-top:8px;color:rgba(255,255,255,0.55);">
                            目前只記錄收據檔案資料，圖片上傳功能將於下一階段接入。
                        </small>
                    </div>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    提交報名
                </button>

                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                ></div>

            </form>

            <div style="text-align:center;">
                <button
                    id="logoutBtn"
                    class="logout-btn"
                    type="button"
                >
                    登出 Google 帳號
                </button>
            </div>

        </div>

    </section>

</main>

<script type="module">

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    auth,
    db
} from "./js/firebase-config.js";


const loadingMessage =
    document.getElementById("loadingMessage");

const formContainer =
    document.getElementById("formContainer");

const emailInput =
    document.getElementById("email");

const form =
    document.getElementById("registrationForm");

const participation =
    document.getElementById("participation");

const partnerGroup =
    document.getElementById("partnerGroup");

const partnerInput =
    document.getElementById("partner");

const receipt =
    document.getElementById("receipt");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");

const logoutBtn =
    document.getElementById("logoutBtn");


let currentUser = null;
let isSubmitting = false;


/* =========================================================
   訊息
   ========================================================= */

function showMessage(text, type = "") {

    message.className = "message";

    if (type) {
        message.classList.add(type);
    }

    message.textContent = text;
}


/* =========================================================
   Firebase 登入狀態
   ========================================================= */

onAuthStateChanged(
    auth,
    (user) => {

        console.log(
            "Firebase Auth User:",
            user
        );


        if (!user) {

            loadingMessage.innerHTML = `
                <div style="color:#ffaaaa;">
                    尚未登入 Google 帳號
                </div>

                <div style="
                    margin-top:10px;
                    font-size:13px;
                    color:rgba(255,255,255,0.6);
                ">
                    請返回首頁重新登入。
                </div>
            `;

            return;
        }


        currentUser = user;

        emailInput.value =
            user.email || "";


        loadingMessage.classList.add(
            "hidden"
        );

        formContainer.classList.remove(
            "hidden"
        );


        console.log(
            "登入成功：",
            user.email
        );

    },
    (error) => {

        console.error(
            "Auth Error:",
            error
        );


        loadingMessage.innerHTML = `
            <div style="color:#ffaaaa;font-weight:700;">
                Firebase 登入狀態錯誤
            </div>

            <div style="
                margin-top:10px;
                font-size:13px;
                white-space:pre-wrap;
                word-break:break-word;
            ">
                ${error.code || ""}
                
                ${error.message || ""}
            </div>
        `;

    }
);


/* =========================================================
   參與方式
   ========================================================= */

participation.addEventListener(
    "change",
    () => {

        if (
            participation.value === "觀眾"
        ) {

            partnerGroup.classList.add(
                "hidden"
            );

            partnerInput.value = "";

        } else {

            partnerGroup.classList.remove(
                "hidden"
            );

        }

    }
);


/* =========================================================
   收據檢查
   ========================================================= */

receipt.addEventListener(
    "change",
    () => {

        const file =
            receipt.files[0];

        if (!file) {
            return;
        }


        const isJpg =
            file.type === "image/jpeg" ||
            file.name
                .toLowerCase()
                .endsWith(".jpg") ||
            file.name
                .toLowerCase()
                .endsWith(".jpeg");


        if (!isJpg) {

            alert(
                "只允許 JPG / JPEG 格式。"
            );

            receipt.value = "";

            return;
        }


        if (
            file.size >
            5 * 1024 * 1024
        ) {

            alert(
                "收據圖片不能超過 5MB。"
            );

            receipt.value = "";

        }

    }
);


/* =========================================================
   登出
   ========================================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);

            location.href =
                "index.html";

        } catch (error) {

            showMessage(
                "登出失敗：" +
                error.message,
                "error-message"
            );

        }

    }
);


/* =========================================================
   提交
   ========================================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();
        event.stopPropagation();


        if (isSubmitting) {
            return;
        }


        /* -----------------------------------------------
           Step 1
        ------------------------------------------------ */

        showMessage(
            "Step 1：開始處理報名資料..."
        );


        console.log(
            "SUBMIT START"
        );


        if (!currentUser) {

            showMessage(
                "錯誤：目前沒有 Google 登入帳號。",
                "error-message"
            );

            return;
        }


        /* -----------------------------------------------
           Step 2
        ------------------------------------------------ */

        showMessage(
            "Step 2：Google 登入確認成功：" +
            currentUser.email
        );


        console.log(
            "CURRENT USER:",
            currentUser
        );


        if (!form.checkValidity()) {

            form.reportValidity();

            return;
        }


        const file =
            receipt.files[0];


        if (!file) {

            showMessage(
                "錯誤：沒有選擇收據。",
                "error-message"
            );

            return;
        }


        /* -----------------------------------------------
           Step 3
        ------------------------------------------------ */

        showMessage(
            "Step 3：表單資料檢查完成..."
        );


        const registrationData = {

            email:
                currentUser.email || "",

            uid:
                currentUser.uid,

            englishName:
                document
                    .getElementById("englishName")
                    .value
                    .trim(),

            icNumber:
                document
                    .getElementById("icNumber")
                    .value
                    .trim(),

            chineseName:
                document
                    .getElementById("chineseName")
                    .value
                    .trim(),

            phone:
                document
                    .getElementById("phone")
                    .value
                    .trim(),

            meal:
                document
                    .getElementById("meal")
                    .value,

            shirtSize:
                document
                    .getElementById("shirtSize")
                    .value,

            shirtText:
                document
                    .getElementById("shirtText")
                    .value
                    .trim(),

            participation:
                participation.value,

            partner:
                participation.value === "觀眾"
                    ? ""
                    : partnerInput.value.trim(),

            platinum:
                document
                    .getElementById("platinum")
                    .value,

            receiptFileName:
                file.name,

            receiptFileType:
                file.type,

            receiptFileSize:
                file.size,

            paymentStatus:
                "待審核",

            paymentAmount:
                null,

            paymentDate:
                null,

            createdAt:
                serverTimestamp(),

            updatedAt:
                serverTimestamp()

        };


        console.log(
            "DATA READY:",
            registrationData
        );


        /* -----------------------------------------------
           Step 4
        ------------------------------------------------ */

        showMessage(
            "Step 4：準備連接 Firestore..."
        );


        isSubmitting = true;

        submitBtn.disabled = true;

        submitBtn.textContent =
            "正在提交...";


        /* -----------------------------------------------
           Step 5
        ------------------------------------------------ */

        showMessage(
            "Step 5：正在寫入 Firestore..."
        );


        console.log(
            "FIRESTORE ADD START"
        );


        try {

            const docRef =
                await Promise.race([

                    addDoc(
                        collection(
                            db,
                            "registrations"
                        ),
                        registrationData
                    ),

                    new Promise(
                        (_, reject) => {

                            setTimeout(
                                () => {

                                    const error =
                                        new Error(
                                            "Firestore 15 秒沒有回應"
                                        );

                                    error.code =
                                        "FIRESTORE_TIMEOUT";

                                    reject(
                                        error
                                    );

                                },
                                15000
                            );

                        }
                    )

                ]);


            /* -------------------------------------------
               Step 6
            -------------------------------------------- */

            console.log(
                "FIRESTORE SUCCESS:",
                docRef.id
            );


            showMessage(
                "Step 6：報名成功！\n\n" +
                "報名編號：" +
                docRef.id,
                "success-message"
            );


            submitBtn.textContent =
                "報名已提交";


            form
                .querySelectorAll(
                    "input, select, textarea, button"
                )
                .forEach(
                    (element) => {

                        element.disabled =
                            true;

                    }
                );


        } catch (error) {

            console.error(
                "FIRESTORE ERROR:",
                error
            );


            /* -------------------------------------------
               顯示完整錯誤
            -------------------------------------------- */

            message.className =
                "message error-message";


            message.innerHTML = `
                <div style="
                    font-size:18px;
                    font-weight:700;
                    margin-bottom:12px;
                ">
                    ❌ 報名提交失敗
                </div>

                <div style="
                    text-align:left;
                    padding:15px;
                    border-radius:12px;
                    background:rgba(255,0,0,0.08);
                    font-size:13px;
                    line-height:1.8;
                    word-break:break-word;
                    white-space:pre-wrap;
                ">
                    錯誤代碼：
                    ${error.code || "未知"}

                    錯誤訊息：
                    ${error.message || "未知"}

                    <br>

                    Firebase：
                    ${db ? "已初始化" : "未初始化"}

                    <br>

                    Google：
                    ${currentUser
                        ? currentUser.email
                        : "未登入"}
                </div>
            `;


            submitBtn.disabled =
                false;

            submitBtn.textContent =
                "重新提交";

            isSubmitting =
                false;

        }

    }
);

</script>

</body>
</html>
