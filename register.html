<script type="module">

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

import {
    auth,
    db
} from "./js/firebase-config.js";


const emailInput =
    document.getElementById("email");

const form =
    document.getElementById("registrationForm");

const participation =
    document.getElementById("participation");

const partnerGroup =
    document.getElementById("partnerGroup");

const partnerInput =
    document.getElementById("partner");

const receipt =
    document.getElementById("receipt");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");

const logoutBtn =
    document.getElementById("logoutBtn");


let currentUser = null;


/*
    ============================
    檢查 Google 登入
    ============================
*/

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "index.html";

        return;
    }

    currentUser = user;

    emailInput.value =
        user.email || "";

});


/*
    ============================
    觀眾 / 參賽搭檔
    ============================
*/

participation.addEventListener(
    "change",
    () => {

        if (participation.value === "觀眾") {

            partnerGroup.classList.add("hidden");

            partnerInput.value = "";

        } else {

            partnerGroup.classList.remove("hidden");

        }

    }
);


/*
    ============================
    JPG 收據檢查
    ============================
*/

receipt.addEventListener(
    "change",
    () => {

        const file =
            receipt.files[0];

        if (!file) return;


        if (
            file.type !== "image/jpeg"
        ) {

            alert(
                "只允許上傳 JPG / JPEG 格式。"
            );

            receipt.value = "";

            return;
        }


        const maxSize =
            5 * 1024 * 1024;


        if (file.size > maxSize) {

            alert(
                "收據圖片不能超過 5MB。"
            );

            receipt.value = "";

        }

    }
);


/*
    ============================
    登出
    ============================
*/

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);

            window.location.href =
                "index.html";

        } catch (error) {

            console.error(error);

            alert(
                "登出失敗，請再試一次。"
            );

        }

    }
);


/*
    ============================
    提交報名
    ============================
*/

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        /*
            確認 Google 登入
        */

        if (!currentUser) {

            message.textContent =
                "登入狀態已失效，請重新登入 Google。";

            return;

        }


        /*
            確認收據
        */

        const file =
            receipt.files[0];


        if (!file) {

            message.textContent =
                "請上傳繳費收據。";

            return;

        }


        /*
            再次確認 JPG
        */

        if (
            file.type !== "image/jpeg"
        ) {

            message.textContent =
                "收據只允許 JPG / JPEG 格式。";

            return;

        }


        /*
            確認檔案大小
        */

        const maxSize =
            5 * 1024 * 1024;


        if (file.size > maxSize) {

            message.textContent =
                "收據圖片不能超過 5MB。";

            return;

        }


        /*
            讀取表單資料
        */

        const englishName =
            document.getElementById("englishName").value.trim();

        const icNumber =
            document.getElementById("icNumber").value.trim();

        const chineseName =
            document.getElementById("chineseName").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const meal =
            document.getElementById("meal").value;

        const shirtSize =
            document.getElementById("shirtSize").value;

        const shirtText =
            document.getElementById("shirtText").value.trim();

        const participationValue =
            participation.value;

        const finalPartner =
            participationValue === "觀眾"
                ? ""
                : partnerInput.value.trim();

        const platinum =
            document.getElementById("platinum").value;


        /*
            ============================
            基本資料確認
            ============================
        */

        if (!englishName ||
            !icNumber ||
            !phone ||
            !meal ||
            !shirtSize ||
            !shirtText ||
            !participationValue ||
            !platinum) {

            message.textContent =
                "請確認所有必填資料都已填寫。";

            return;

        }


        /*
            ============================
            開始提交
            ============================
        */

        submitBtn.disabled = true;

        submitBtn.textContent =
            "正在提交...";

        message.textContent =
            "正在儲存報名資料，請稍候...";


        try {


            /*
                ============================
                寫入 Firestore
                ============================
            */

            const registrationData = {

                /*
                    Google 帳號
                */

                email:
                    currentUser.email,

                uid:
                    currentUser.uid,


                /*
                    個人資料
                */

                englishName:
                    englishName,

                icNumber:
                    icNumber,

                chineseName:
                    chineseName,

                phone:
                    phone,


                /*
                    活動資料
                */

                meal:
                    meal,

                shirtSize:
                    shirtSize,

                shirtText:
                    shirtText,

                participation:
                    participationValue,

                partner:
                    finalPartner,


                /*
                    白金
                    第一版保留：
                    報名者自行選擇
                */

                platinum:
                    platinum,


                /*
                    收據基本資料
                    目前尚未上傳 Storage
                */

                receiptFileName:
                    file.name,

                receiptFileType:
                    file.type,

                receiptFileSize:
                    file.size,


                /*
                    繳費狀態
                */

                paymentStatus:
                    "待審核",

                paymentAmount:
                    null,

                paymentDate:
                    null,


                /*
                    時間
                */

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            };


            /*
                寫入 registrations
            */

            const docRef =
                await addDoc(
                    collection(db, "registrations"),
                    registrationData
                );


            /*
                ============================
                成功
                ============================
            */

            message.innerHTML = `
                <div style="font-size:22px;font-weight:700;">
                    ✅ 報名成功
                </div>

                <div style="margin-top:10px;">
                    您的報名資料已成功提交。
                </div>

                <div style="margin-top:8px;">
                    報名編號：
                    <strong>${docRef.id}</strong>
                </div>

                <div style="margin-top:10px;">
                    繳費狀態：待審核
                </div>
            `;


            /*
                防止重複提交
            */

            submitBtn.disabled = true;

            submitBtn.textContent =
                "報名已提交";


            /*
                鎖定表單
            */

            const inputs =
                form.querySelectorAll(
                    "input, select, textarea"
                );

            inputs.forEach(
                (input) => {
                    input.disabled = true;
                }
            );


        } catch (error) {

            console.error(
                "Firestore 提交錯誤：",
                error
            );


            /*
                顯示錯誤
            */

            message.innerHTML = `
                <div style="font-weight:700;">
                    ❌ 報名提交失敗
                </div>

                <div style="margin-top:8px;">
                    ${error.message}
                </div>

                <div style="margin-top:8px;font-size:13px;opacity:0.7;">
                    請截圖這個錯誤訊息給管理員。
                </div>
            `;


            submitBtn.disabled = false;

            submitBtn.textContent =
                "重新提交";

        }

    }
);

</script>
