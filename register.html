<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>活動報名｜BS 活動報名中心</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="container">

  <section class="card hero" style="padding:24px 16px">
    <div class="badge">📝 活動報名</div>
    <h1 id="pageTitle">活動報名</h1>
  </section>

  <!-- 登入 -->
  <div class="card" id="loginCard" style="text-align:center">
    <div style="font-size:42px">🔐</div>
    <h2>請先登入</h2>
    <p class="muted">使用 Google 帳號登入後即可報名。<br>系統會自動帶入你的 Google Email。</p>
    <button type="button" class="btn-google" id="googleLoginBtn">🔵 使用 Google 登入</button>
    <div id="loginMessage" class="message"></div>
  </div>

  <!-- 活動分頁（避免報錯活動） -->
  <div class="tabs hidden" id="tabs"></div>

  <div class="card hidden" id="pickCard">
    <div class="closed-box" style="background:#f7fbf7">👆 請先在上方選擇你要報名的活動</div>
  </div>

  <div class="card hidden" id="closedCard">
    <div class="closed-box">🔒 此活動目前未開放報名。<br>如有疑問請聯絡主辦單位。</div>
    <a class="btn btn-secondary" href="index.html">← 返回活動頁</a>
  </div>

  <!-- 表單 -->
  <div class="card hidden" id="formCard">
    <div class="event-banner" id="banner"></div>
    <div class="user-info" id="userInfo"></div>
    <div class="notice-ok hidden" id="editNotice">✏️ 目前是修改模式；原本的收據會保留，如需更換才重新上傳。</div>

    <form id="regForm">
      <div class="field">
        <label>Google Email</label>
        <input type="email" id="email" readonly>
      </div>

      <div id="dynamicFields"></div>

      <div class="field hidden" id="platinumField">
        <label>💎 Platinum <span class="required">*</span></label>
        <select id="platinum"><option value="">請選擇你的 Platinum</option></select>
        <div class="help hidden" id="platinumHelp">修改模式不能更換原本的 Platinum。</div>
      </div>

      <div class="price-box hidden" id="priceBox"></div>

      <div class="field hidden" id="receiptField">
        <label>🧾 繳費收據 JPG <span class="required" id="receiptReq">*</span></label>
        <div class="upload-box">
          <input type="file" id="receipt" accept=".jpg,.jpeg,image/jpeg">
          <div class="notice-ok hidden" id="existingReceipt" style="margin-top:10px">✅ 原本的繳費收據已保存，不需更換可直接儲存。</div>
          <div class="help">必須是 JPG / JPEG，圖片不可超過 5MB。</div>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">🚀 提交報名</button>
      <div id="formMessage" class="message"></div>
    </form>
  </div>

  <!-- 成功 -->
  <div class="card hidden" id="successCard" style="text-align:center">
    <div style="font-size:48px">🎉</div>
    <h2 id="successTitle">報名成功！</h2>
    <p class="muted pre" id="successText"></p>
    <button class="btn-primary" id="continueBtn">➕ 繼續幫其他人報名</button>
    <a class="btn btn-secondary" href="my-record.html">🔎 查看我的資料</a>
    <a class="btn btn-secondary" href="index.html">🏠 返回活動頁</a>
  </div>

  <div style="margin-top:24px"><a class="btn btn-secondary" href="index.html">← 返回活動頁</a></div>
</div>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import {
  GoogleAuthProvider, signInWithPopup, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection, addDoc, updateDoc, getDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {
  PLATINUM_UIDS, esc, loadEvents, controlHtml, readValues, uploadReceipt
} from "./js/shared.js";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const editId = params.get("edit");
const isEdit = Boolean(editId);
let eventId = params.get("event") || "";
let events = [], ev = null, original = null;

function show(...ids) {
  ["tabs","pickCard","closedCard","formCard","successCard"].forEach(i => $(i).classList.add("hidden"));
  ids.forEach(i => $(i).classList.remove("hidden"));
}
const msg = $("formMessage");
function setMsg(text, color = "#718078") { msg.textContent = text; msg.style.color = color; }
function fail(text) {
  setMsg(text, "#c84b4b");
  $("submitBtn").disabled = false;
  $("submitBtn").textContent = isEdit ? "💾 儲存修改" : "🚀 提交報名";
}
function errText(e) { return e?.message || e?.code || String(e || "未知錯誤"); }

$("googleLoginBtn").onclick = async () => {
  const b = $("googleLoginBtn");
  try {
    b.disabled = true;
    $("loginMessage").textContent = "正在開啟 Google 登入...";
    const p = new GoogleAuthProvider();
    p.setCustomParameters({ prompt: "select_account" });
    await signInWithPopup(auth, p);
  } catch (e) {
    $("loginMessage").textContent = "Google 登入失敗：" + errText(e);
    b.disabled = false;
  }
};

onAuthStateChanged(auth, async user => {
  if (!user) {
    $("loginCard").classList.remove("hidden");
    show();
    return;
  }
  $("loginCard").classList.add("hidden");
  $("email").value = user.email || "";
  $("userInfo").innerHTML = "✅ 已登入：<strong>" + esc(user.email || "") + "</strong>";
  try { await init(user); } catch (e) { console.error(e); show("formCard"); fail(errText(e)); }
});

function renderTabs() {
  // 修改模式不顯示分頁，避免換到別的活動
  if (isEdit) { $("tabs").classList.add("hidden"); return; }
  const list = events.filter(e => e.status === "open");
  $("tabs").innerHTML = list.map(e =>
    `<a class="tab ${e.id === eventId ? "active" : ""}" href="register.html?event=${encodeURIComponent(e.id)}">${esc(e.title)}</a>`
  ).join("");
  $("tabs").classList.remove("hidden");
}

async function init(user) {
  events = await loadEvents(db);

  if (isEdit) {
    const snap = await getDoc(doc(db, "registrations", editId));
    if (!snap.exists()) throw new Error("找不到這筆報名資料。");
    original = snap.data();
    if (original.uid !== user.uid) throw new Error("你沒有權限修改這筆資料。");
    eventId = original.eventId || "";
  }

  ev = events.find(e => e.id === eventId) || null;

  if (!ev) {
    if (isEdit) throw new Error("這筆資料尚未歸入任何活動，請聯絡管理員。");
    renderTabs();
    $("pageTitle").textContent = "請選擇活動";
    $("tabs").classList.remove("hidden");
    $("pickCard").classList.remove("hidden");
    return;
  }

  $("pageTitle").textContent = ev.title;
  document.title = "報名｜" + ev.title;

  if (!isEdit && ev.status !== "open") {
    renderTabs();
    $("tabs").classList.remove("hidden");
    $("closedCard").classList.remove("hidden");
    return;
  }

  renderForm();
  renderTabs();
  show("formCard");
  if (!isEdit) $("tabs").classList.remove("hidden");
}

function renderForm() {
  $("banner").innerHTML = `${isEdit ? "✏️ 你正在修改" : "📢 你正在報名"}<br><strong>${esc(ev.title)}</strong>` +
    (ev.subtitle ? `<br>${esc(ev.subtitle)}` : "");
  $("editNotice").classList.toggle("hidden", !isEdit);

  $("dynamicFields").innerHTML = (ev.fields || []).map(f => `
    <div class="field">
      <label>${esc(f.label)} ${f.required ? '<span class="required">*</span>' : '<span class="muted">（選填）</span>'}</label>
      ${controlHtml(f, original ? original[f.key] : "", "form")}
    </div>`).join("");

  // Platinum
  if (ev.platinumEnabled) {
    $("platinumField").classList.remove("hidden");
    $("platinum").innerHTML = `<option value="">請選擇你的 Platinum</option>` +
      Object.keys(PLATINUM_UIDS).map(n => `<option>${esc(n)}</option>`).join("");
    if (original) $("platinum").value = original.platinum || "";
    if (isEdit) { $("platinum").disabled = true; $("platinumHelp").classList.remove("hidden"); }
  }

  // 費用與繳費資料
  if (ev.fee || ev.paymentText || ev.paymentImage) {
    $("priceBox").classList.remove("hidden");
    $("priceBox").innerHTML =
      (ev.fee ? `<div class="price-main">${esc(ev.fee)}</div>` : "") +
      (ev.paymentText ? `<div class="pay">${esc(ev.paymentText)}</div>` : "") +
      (ev.paymentImage ? `<img src="${esc(ev.paymentImage)}" alt="繳費資料">` : "");
  }

  // 收據
  if (ev.receiptRequired) {
    $("receiptField").classList.remove("hidden");
    if (isEdit && original?.receiptFileId) {
      $("receiptReq").classList.add("hidden");
      $("existingReceipt").classList.remove("hidden");
    }
  }
  $("submitBtn").textContent = isEdit ? "💾 儲存修改" : "🚀 提交報名";
}

$("regForm").addEventListener("submit", async e => {
  e.preventDefault();
  setMsg("");
  const user = auth.currentUser;
  if (!user) return fail("請先使用 Google 登入。");
  if (!ev) return fail("找不到活動資料。");
  if (!isEdit && ev.status !== "open") return fail("此活動已停止報名。");

  const values = readValues($("regForm"), ev.fields || []);
  for (const f of ev.fields || []) {
    if (f.required && !values[f.key]) return fail(`請填寫「${f.label}」。`);
  }

  const platinum = ev.platinumEnabled ? (isEdit ? (original.platinum || "") : $("platinum").value) : "";
  if (ev.platinumEnabled && !platinum) return fail("請選擇你的 Platinum。");
  const platinumUid = ev.platinumEnabled
    ? (isEdit ? (original.platinumUid || PLATINUM_UIDS[platinum] || "") : (PLATINUM_UIDS[platinum] || ""))
    : "";

  const receipt = $("receipt").files?.[0] || null;
  if (ev.receiptRequired && !receipt && !(isEdit && original?.receiptFileId)) {
    return fail("請上傳繳費收據 JPG。");
  }
  if (receipt) {
    if (!(receipt.type === "image/jpeg" || /\.(jpg|jpeg)$/i.test(receipt.name))) return fail("收據只接受 JPG / JPEG 格式。");
    if (receipt.size > 5 * 1024 * 1024) return fail("收據圖片不能超過 5MB。");
  }

  if (!isEdit && !confirm(`你正在報名「${ev.title}」，確定提交嗎？`)) return;

  $("submitBtn").disabled = true;
  $("submitBtn").textContent = "⏳ 處理中...";

  try {
    let drive = null;
    if (receipt) {
      setMsg("🧾 正在上傳繳費收據，請不要關閉頁面...", "#9a6815");
      const hint = (values.englishName || values.chineseName || user.displayName || "receipt");
      drive = await uploadReceipt(receipt, ev.title + "_" + hint);
      if (!drive?.success) throw new Error("繳費收據上傳失敗。");
    }

    const data = {
      ...values,
      uid: user.uid,
      email: user.email || "",
      googleName: user.displayName || "",
      eventId: ev.id,
      eventTitle: ev.title,
      platinum,
      platinumUid
    };

    if (drive) {
      data.receiptName = receipt.name;
      data.receiptType = receipt.type || "image/jpeg";
      data.receiptSize = receipt.size;
      data.receiptFileId = drive.fileId || "";
      data.receiptFileName = drive.fileName || "";
      data.receiptDriveUrl = drive.driveUrl || "";
    } else if (isEdit) {
      ["receiptName","receiptType","receiptSize","receiptFileId","receiptFileName","receiptDriveUrl"]
        .forEach(k => data[k] = original?.[k] ?? (k === "receiptSize" ? 0 : ""));
    }

    if (isEdit) {
      await updateDoc(doc(db, "registrations", editId), data);
      alert("你的資料已成功更新！");
      location.href = "my-record.html";
      return;
    }

    data.createdAt = serverTimestamp();
    await addDoc(collection(db, "registrations"), data);

    $("successText").textContent = ev.successMessage ||
      `你已成功報名「${ev.title}」。` + (ev.receiptRequired ? "\n繳費收據也已成功保存。" : "");
    show("successCard");
  } catch (err) {
    console.error(err);
    let t = errText(err);
    if (/permission|insufficient/i.test(t)) t = "沒有寫入權限（可能活動已關閉報名或 Firestore Rules 未更新）。";
    fail("提交失敗：" + t);
    return;
  }
  $("submitBtn").disabled = false;
});

$("continueBtn").onclick = () => {
  $("regForm").reset();
  $("receipt").value = "";
  original = null;
  renderForm();
  $("email").value = auth.currentUser?.email || "";
  show("formCard");
  $("tabs").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
};
</script>
</body>
</html>
