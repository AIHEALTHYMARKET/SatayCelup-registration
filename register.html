<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SatayCelup之戰｜活動報名</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .form-page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 30px 18px 60px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 36px;
            margin: 15px 0 8px;
        }

        .form-header p {
            color: rgba(255,255,255,0.65);
        }

        .form-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 22px;
            padding: 28px;
            backdrop-filter: blur(18px);
        }

        .form-section {
            margin-bottom: 30px;
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .required {
            color: #ff8b8b;
        }

        input,
        select,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(0,0,0,0.25);
            color: white;
            font-size: 15px;
            outline: none;
        }

        select option {
            color: #111;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: rgba(255,255,255,0.55);
        }

        input:disabled,
        select:disabled,
        textarea:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .readonly {
            opacity: 0.7;
        }

        .event-notice {
            padding: 18px;
            margin-bottom: 25px;
            border-radius: 15px;
            background: rgba(0,0,0,0.2);
            line-height: 1.7;
        }

        .event-notice strong {
            font-size: 20px;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: white;
            color: #17120d;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.6;
            word-break: break-word;
        }

        .success-message {
            color: #9ff0b0;
        }

        .error-message {
            color: #ffaaaa;
        }

        .logout-btn {
            margin-top: 18px;
            background: transparent;
            color: rgba(255,255,255,0.65);
            border: none;
            cursor: pointer;
        }

        .logout-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .hidden {
            display: none;
        }

        .loading-message {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
        }

        .debug-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,0,0,0.08);
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media(max-width:600px) {
            .form-card {
                padding: 20px 16px;
            }

            .form-header h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<main class="form-page">

    <header class="form-header">
        <div class="badge">
            2026 EVENT
        </div>

        <h1>SatayCelup之戰</h1>

        <p>
            活動報名表
        </p>
    </header>

    <section class="form-card">

        <div id="loadingMessage" class="loading-message">
            正在確認 Google 登入狀態...
        </div>

        <div id="formContainer" class="hidden">

            <div class="event-notice">
                <div>
                    活動費用：
                    <strong>RM168</strong>
                </div>

                <div>
                    繳費日期：
                    <strong>05/09/2026 - 25/09/2026</strong>
                </div>

                <div style="margin-top:8px;">
                    請確認付款後再提交報名資料。
                </div>
            </div>

            <form id="registrationForm">

                <div class="form-section">

                    <div class="form-section-title">
                        ① 個人資料
                    </div>

                    <div class="form-group">
                        <label>
                            Google Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="readonly"
                            readonly
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            IC上英文姓名
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="englishName"
                            placeholder="請按照 IC 上的英文姓名填寫"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            IC號碼
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="icNumber"
                            placeholder="請輸入 IC 號碼"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            中文名或匿名
                        </label>

                        <input
                            type="text"
                            id="chineseName"
                            placeholder="可填中文姓名，也可以填匿名"
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            聯絡電話
                            <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="例如：0123456789"
                            required
                        >
                    </div>

                </div>

                <div class="form-section">

                    <div class="form-section-title">
                        ② 活動資料
                    </div>

                    <div class="form-group">
                        <label>
                            膳食
                            <span class="required">*</span>
                        </label>

                        <select id="meal" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="葷">
                                葷
                            </option>

                            <option value="素">
                                素
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            衣服尺寸
                            <span class="required">*</span>
                        </label>

                        <select id="shirtSize" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                            <option value="XXXL">XXXL</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>
                            衣服背後文字
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="shirtText"
                            maxlength="30"
                            placeholder="例如：WYANE"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            參與方式
                            <span class="required">*</span>
                        </label>

                        <select id="participation" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="羽球">
                                羽球
                            </option>

                            <option value="pickleball">
                                pickleball
                            </option>

                            <option value="觀眾">
                                觀眾
                            </option>
                        </select>
                    </div>

                    <div
                        class="form-group"
                        id="partnerGroup"
                    >
                        <label>
                            參賽搭檔
                        </label>

                        <input
                            type="text"
                            id="partner"
                            placeholder="請輸入參賽搭檔姓名"
                        >
                    </div>

                    <div class="form-group">
                        <label>
                            白金
                            <span class="required">*</span>
                        </label>

                        <select id="platinum" required>
                            <option value="">
                                請選擇
                            </option>

                            <option value="Sense&Lavenier">
                                Sense&Lavenier
                            </option>

                            <option value="Amos">
                                Amos
                            </option>

                            <option value="Sunny">
                                Sunny
                            </option>

                            <option value="Robin&Zoey">
                                Robin&Zoey
                            </option>

                            <option value="RyanLio">
                                RyanLio
                            </option>

                            <option value="Wyane&Momo">
                                Wyane&Momo
                            </option>

                            <option value="Jess">
                                Jess
                            </option>

                            <option value="Keong&Ngah">
                                Keong&Ngah
                            </option>

                            <option value="JayChew">
                                JayChew
                            </option>

                            <option value="Lynn">
                                Lynn
                            </option>

                            <option value="SzeChew">
                                SzeChew
                            </option>
                        </select>
                    </div>

                </div>

                <div class="form-section">

                    <div class="form-section-title">
                        ③ 繳費資料
                    </div>

                    <div class="event-notice">
                        <div>
                            <strong>RM168</strong>
                        </div>

                        <div>
                            有效繳費日期：
                            05/09/2026 至 25/09/2026
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            繳費收據 JPG
                            <span class="required">*</span>
                        </label>

                        <input
                            type="file"
                            id="receipt"
                            accept=".jpg,.jpeg,image/jpeg"
                            required
                        >

                        <small style="display:block;margin-top:8px;color:rgba(255,255,255,0.55);">
                            目前只記錄收據檔案資料，圖片上傳功能將於下一階段接入。
                        </small>
                    </div>

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="submitBtn"
                >
                    提交報名
                </button>

                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                ></div>

            </form>

            <div style="text-align:center;">
                <button
                    id="logoutBtn"
                    class="logout-btn"
                    type="button"
                >
                    登出 Google 帳號
                </button>
            </div>

        </div>

    </section>

</main>

<script type="module">

/* =========================================================
   SatayCelup之戰
   register.html - Firebase Google Login 穩定版
   ========================================================= */

const loadingMessage =
    document.getElementById("loadingMessage");

const formContainer =
    document.getElementById("formContainer");

const emailInput =
    document.getElementById("email");

const form =
    document.getElementById("registrationForm");

const participation =
    document.getElementById("participation");

const partnerGroup =
    document.getElementById("partnerGroup");

const partnerInput =
    document.getElementById("partner");

const receipt =
    document.getElementById("receipt");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");

const logoutBtn =
    document.getElementById("logoutBtn");


let auth = null;
let db = null;
let currentUser = null;
let isSubmitting = false;


/* =========================================================
   顯示載入狀態
   ========================================================= */

function setLoading(text) {

    loadingMessage.classList.remove("hidden");

    loadingMessage.innerHTML = `
        ${text}
    `;
}


/* =========================================================
   顯示錯誤
   ========================================================= */

function showLoadingError(title, detail = "") {

    loadingMessage.classList.remove("hidden");

    loadingMessage.innerHTML = `
        <div style="
            color:#ffaaaa;
            font-weight:700;
            font-size:16px;
            margin-bottom:10px;
        ">
            ${title}
        </div>

        <div style="
            color:rgba(255,255,255,0.7);
            font-size:13px;
            line-height:1.7;
            word-break:break-word;
        ">
            ${detail}
        </div>

        <button
            type="button"
            onclick="location.reload()"
            style="
                margin-top:18px;
                padding:12px 20px;
                border:0;
                border-radius:10px;
                background:white;
                color:#17120d;
                font-weight:700;
                cursor:pointer;
            "
        >
            重新載入
        </button>

        <div style="
            margin-top:18px;
            font-size:11px;
            color:rgba(255,255,255,0.45);
        ">
            如果重新載入後仍然出現此訊息，請把這個畫面截圖給管理員。
        </div>
    `;
}


/* =========================================================
   顯示成功登入後的表格
   ========================================================= */

function showRegistrationForm(user) {

    currentUser = user;

    emailInput.value =
        user.email || "";

    loadingMessage.classList.add("hidden");

    formContainer.classList.remove("hidden");

    console.log(
        "Google 登入成功",
        user
    );
}


/* =========================================================
   初始化 Firebase
   ========================================================= */

async function initializeFirebase() {

    try {

        setLoading(
            "正在連接 Firebase..."
        );


        /* Firebase Auth */

        const authModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"
            );


        /* Firebase Firestore */

        const firestoreModule =
            await import(
                "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
            );


        /* Firebase config */

        const firebaseModule =
            await import(
                "./js/firebase-config.js"
            );


        auth =
            firebaseModule.auth;

        db =
            firebaseModule.db;


        console.log(
            "Firebase 初始化成功"
        );


        /* =================================================
           先檢查 Redirect 登入結果
           ================================================= */

        setLoading(
            "正在確認 Google 登入狀態..."
        );


        let redirectResult = null;


        try {

            redirectResult =
                await authModule.getRedirectResult(auth);

            console.log(
                "Redirect 登入結果：",
                redirectResult
            );

        } catch (redirectError) {

            console.error(
                "Google Redirect 錯誤：",
                redirectError
            );


            showLoadingError(
                "Google 登入出現問題",
                "錯誤代碼：" +
                (redirectError.code || "未知") +
                "\n\n" +
                "錯誤訊息：" +
                (redirectError.message || "未知錯誤")
            );

            return;
        }


        /* =================================================
           如果 Redirect 直接帶回 user
           ================================================= */

        if (
            redirectResult &&
            redirectResult.user
        ) {

            showRegistrationForm(
                redirectResult.user
            );

            return;
        }


        /* =================================================
           再檢查目前 Firebase Auth 狀態
           ================================================= */

        let authResolved = false;


        const unsubscribe =
            authModule.onAuthStateChanged(
                auth,
                (user) => {

                    if (authResolved) {
                        return;
                    }

                    authResolved = true;

                    unsubscribe();

                    console.log(
                        "onAuthStateChanged：",
                        user
                    );


                    if (user) {

                        showRegistrationForm(
                            user
                        );

                        return;
                    }


                    /* 沒有登入 */

                    showLoadingError(
                        "尚未登入 Google 帳號",
                        "請返回首頁重新使用 Google 登入。"
                    );

                },
                (error) => {

                    if (authResolved) {
                        return;
                    }

                    authResolved = true;

                    unsubscribe();

                    console.error(
                        "Firebase Auth 狀態錯誤：",
                        error
                    );


                    showLoadingError(
                        "Firebase 登入狀態檢查失敗",
                        "錯誤代碼：" +
                        (error.code || "未知") +
                        "\n\n" +
                        "錯誤訊息：" +
                        (error.message || "未知錯誤")
                    );

                }
            );


        /* =================================================
           15 秒安全 timeout
           防止永遠卡在「正在確認」
           ================================================= */

        setTimeout(
            () => {

                if (authResolved) {
                    return;
                }


                authResolved = true;

                try {
                    unsubscribe();
                } catch (e) {}


                showLoadingError(
                    "Firebase 登入確認逾時",
                    "Google 登入狀態在 15 秒內沒有回應。\n\n" +
                    "這通常表示 Firebase Auth、Google 登入設定或瀏覽器環境出現問題。"
                );

            },
            15000
        );


    } catch (error) {

        console.error(
            "Firebase 初始化失敗：",
            error
        );


        showLoadingError(
            "Firebase 初始化失敗",
            "錯誤代碼：" +
            (error.code || "未知") +
            "\n\n" +
            "錯誤訊息：" +
            (error.message || "未知錯誤")
        );

    }

}


/* =========================================================
   觀眾不需要搭檔
   ========================================================= */

participation.addEventListener(
    "change",
    () => {

        if (
            participation.value === "觀眾"
        ) {

            partnerGroup.classList.add(
                "hidden"
            );

            partnerInput.value = "";

        } else {

            partnerGroup.classList.remove(
                "hidden"
            );

        }

    }
);


/* =========================================================
   收據 JPG 檢查
   ========================================================= */

receipt.addEventListener(
    "change",
    () => {

        const file =
            receipt.files[0];

        if (!file) {
            return;
        }


        const isJpg =
            file.type === "image/jpeg" ||
            file.name
                .toLowerCase()
                .endsWith(".jpg") ||
            file.name
                .toLowerCase()
                .endsWith(".jpeg");


        if (!isJpg) {

            alert(
                "只允許上傳 JPG / JPEG 格式。"
            );

            receipt.value = "";

            return;
        }


        const maxSize =
            5 * 1024 * 1024;


        if (
            file.size > maxSize
        ) {

            alert(
                "收據圖片不能超過 5MB。"
            );

            receipt.value = "";

        }

    }
);


/* =========================================================
   登出
   ========================================================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        logoutBtn.disabled = true;

        try {

            const authModule =
                await import(
                    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"
                );


            await authModule.signOut(
                auth
            );


            window.location.href =
                "index.html";


        } catch (error) {

            console.error(error);


            showMessage(
                "登出失敗：" +
                (error.message || "未知錯誤"),
                "error-message"
            );


            logoutBtn.disabled = false;

        }

    }
);


/* =========================================================
   提交報名
   ========================================================= */

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        event.stopPropagation();


        if (isSubmitting) {
            return;
        }


        if (!currentUser) {

            showMessage(
                "Google 登入狀態已失效，請重新登入。",
                "error-message"
            );

            return;
        }


        if (!form.checkValidity()) {

            form.reportValidity();

            return;
        }


        const file =
            receipt.files[0];


        if (!file) {

            showMessage(
                "請上傳繳費收據。",
                "error-message"
            );

            return;
        }


        const isJpg =
            file.type === "image/jpeg" ||
            file.name
                .toLowerCase()
                .endsWith(".jpg") ||
            file.name
                .toLowerCase()
                .endsWith(".jpeg");


        if (!isJpg) {

            showMessage(
                "收據只允許 JPG / JPEG 格式。",
                "error-message"
            );

            return;
        }


        const maxSize =
            5 * 1024 * 1024;


        if (
            file.size > maxSize
        ) {

            showMessage(
                "收據圖片不能超過 5MB。",
                "error-message"
            );

            return;
        }


        /* =================================================
           取得表單資料
           ================================================= */

        const englishName =
            document
                .getElementById("englishName")
                .value
                .trim();


        const icNumber =
            document
                .getElementById("icNumber")
                .value
                .trim();


        const chineseName =
            document
                .getElementById("chineseName")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const meal =
            document
                .getElementById("meal")
                .value;


        const shirtSize =
            document
                .getElementById("shirtSize")
                .value;


        const shirtText =
            document
                .getElementById("shirtText")
                .value
                .trim();


        const participationValue =
            participation.value;


        const finalPartner =
            participationValue === "觀眾"
                ? ""
                : partnerInput.value.trim();


        const platinum =
            document
                .getElementById("platinum")
                .value;


        /* =================================================
           防止重複提交
           ================================================= */

        isSubmitting = true;

        submitBtn.disabled = true;

        submitBtn.textContent =
            "正在提交...";


        showMessage(
            "正在儲存報名資料，請稍候..."
        );


        try {

            const firestoreModule =
                await import(
                    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
                );


            const registrationData = {

                email:
                    currentUser.email || "",

                uid:
                    currentUser.uid,

                englishName:
                    englishName,

                icNumber:
                    icNumber,

                chineseName:
                    chineseName,

                phone:
                    phone,

                meal:
                    meal,

                shirtSize:
                    shirtSize,

                shirtText:
                    shirtText,

                participation:
                    participationValue,

                partner:
                    finalPartner,

                platinum:
                    platinum,

                receiptFileName:
                    file.name,

                receiptFileType:
                    file.type,

                receiptFileSize:
                    file.size,

                paymentStatus:
                    "待審核",

                paymentAmount:
                    null,

                paymentDate:
                    null,

                createdAt:
                    firestoreModule.serverTimestamp(),

                updatedAt:
                    firestoreModule.serverTimestamp()

            };


            console.log(
                "準備寫入 Firestore：",
                registrationData
            );


            const docRef =
                await firestoreModule.addDoc(
                    firestoreModule.collection(
                        db,
                        "registrations"
                    ),
                    registrationData
                );


            console.log(
                "Firestore 寫入成功：",
                docRef.id
            );


            showMessage(
                "報名成功！報名編號：" +
                docRef.id,
                "success-message"
            );


            submitBtn.textContent =
                "報名已提交";


            const inputs =
                form.querySelectorAll(
                    "input, select, textarea, button"
                );


            inputs.forEach(
                (input) => {

                    input.disabled =
                        true;

                }
            );


        } catch (error) {

            console.error(
                "Firestore 提交錯誤：",
                error
            );


            showMessage(
                "報名提交失敗：" +
                (error.message || "未知錯誤"),
                "error-message"
            );


            const debugBox =
                document.createElement(
                    "div"
                );


            debugBox.className =
                "debug-box";


            debugBox.textContent =
                "錯誤代碼：" +
                (error.code || "無") +
                "\n錯誤訊息：" +
                (error.message || "無");


            message.appendChild(
                debugBox
            );


            submitBtn.disabled =
                false;


            submitBtn.textContent =
                "重新提交";


            isSubmitting =
                false;

        }

    }
);


/* =========================================================
   啟動
   ========================================================= */

initializeFirebase();


</script>

</body>
</html>
