<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 登入診斷</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 25px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        h2 {
            margin-top: 0;
        }

        .item {
            padding: 12px;
            margin: 8px 0;
            background: #f1f1f1;
            border-radius: 8px;
            word-break: break-all;
        }

        .success {
            background: #dff6e4;
            color: #176b2c;
        }

        .error {
            background: #ffe1e1;
            color: #a00000;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Firebase 登入診斷</h2>

    <div id="result">
        正在檢查...
    </div>

    <button onclick="location.href='index.html?v=999'">
        回到首頁
    </button>

</div>


<script type="module">

import {
    onAuthStateChanged,
    getRedirectResult
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import { auth } from "./js/firebase-config.js";


const result = document.getElementById("result");


function show(title, value, type = "") {

    const div = document.createElement("div");

    div.className = "item " + type;

    div.innerHTML =
        "<strong>" +
        title +
        "</strong><br>" +
        String(value);

    result.appendChild(div);
}


result.innerHTML = "";


/* ==========================
   1. Firebase Auth
========================== */

show(
    "① Firebase Auth",
    auth ? "Auth 初始化成功" : "Auth 不存在",
    auth ? "success" : "error"
);


/* ==========================
   2. Current User
========================== */

show(
    "② auth.currentUser",
    auth.currentUser
        ? auth.currentUser.email
        : "目前是 NULL",
    auth.currentUser
        ? "success"
        : "error"
);


/* ==========================
   3. Redirect Result
========================== */

try {

    const redirectResult =
        await getRedirectResult(auth);

    if (redirectResult && redirectResult.user) {

        show(
            "③ Redirect Login",
            "成功：" +
            redirectResult.user.email,
            "success"
        );

    } else {

        show(
            "③ Redirect Login",
            "沒有 Redirect 登入結果"
        );

    }

} catch (error) {

    show(
        "③ Redirect Login ERROR",
        error.code + " / " + error.message,
        "error"
    );

}


/* ==========================
   4. Auth State
========================== */

let authStateReceived = false;

const unsubscribe =
    onAuthStateChanged(
        auth,
        (user) => {

            authStateReceived = true;

            if (user) {

                show(
                    "④ onAuthStateChanged",
                    "登入成功：" + user.email,
                    "success"
                );

                show(
                    "⑤ UID",
                    user.uid,
                    "success"
                );

                show(
                    "⑥ Google Name",
                    user.displayName || "沒有名稱"
                );

                show(
                    "⑦ Google Email",
                    user.email || "沒有 Email"
                );

                show(
                    "⑧ Provider",
                    user.providerData
                        .map(x => x.providerId)
                        .join(", "),
                    "success"
                );

            } else {

                show(
                    "④ onAuthStateChanged",
                    "Firebase 認定目前沒有登入",
                    "error"
                );

            }

            unsubscribe();

        }
    );


/* ==========================
   5. 10秒 Timeout
========================== */

setTimeout(() => {

    if (!authStateReceived) {

        show(
            "⑨ Auth State Timeout",
            "10秒內 Firebase 沒有回傳登入狀態。",
            "error"
        );

    }

}, 10000);

</script>

</body>
</html>
