<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS 活動報名中心</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<main class="container">

  <section class="card hero">
    <div class="badge">🎉 BS EVENTS</div>
    <h1>BS 活動報名中心</h1>
    <p class="muted">選擇下方活動分頁，查看詳情並報名</p>
  </section>

  <div class="tabs" id="tabs"></div>

  <div id="eventArea"><div class="card muted" style="text-align:center">載入活動中……</div></div>

  <section class="card">
    <h2>🔎 查詢／修改我的資料</h2>
    <p class="muted">已報名的朋友，可以登入 Google 查看自己報名了哪些活動，並修改允許修改的內容。</p>
    <a class="btn btn-primary" href="my-record.html">🔎 查詢／修改我的資料</a>
  </section>

  <footer class="footer">🏓 BS 活動報名中心<br><br><a href="privacy.html">🔒 隱私權政策</a></footer>
</main>

<div class="lightbox" id="lightbox"><button id="lbClose" aria-label="關閉">×</button><img id="lbImg" alt=""></div>

<script type="module">
import { db } from "./js/firebase-config.js";
import { loadEvents, esc, videoHtml } from "./js/shared.js";

const tabsEl = document.getElementById("tabs");
const area = document.getElementById("eventArea");
let events = [];
let currentId = "";

function openLb(src){ document.getElementById("lbImg").src = src; document.getElementById("lightbox").classList.add("active"); }
function closeLb(){ document.getElementById("lightbox").classList.remove("active"); }
document.getElementById("lbClose").onclick = closeLb;
document.getElementById("lightbox").onclick = e => { if (e.target.id === "lightbox") closeLb(); };

function renderTabs() {
  tabsEl.innerHTML = events.map(ev =>
    `<button class="tab ${ev.id === currentId ? "active" : ""} ${ev.status !== "open" ? "closed" : ""}" data-id="${esc(ev.id)}" style="width:auto">
      ${ev.status === "open" ? "" : "🔒 "}${esc(ev.title)}</button>`
  ).join("");
}

function renderEvent() {
  const ev = events.find(e => e.id === currentId);
  if (!ev) return;
  const photos = (ev.photos || []).filter(Boolean);
  const info = (ev.infoItems || []).filter(i => i && (i.label || i.value));
  const open = ev.status === "open";

  area.innerHTML = `
    <section class="card hero">
      <div class="badge">${open ? "🟢 報名中" : "🔒 報名已截止"}</div>
      <h1>${esc(ev.title)}</h1>
      ${ev.subtitle ? `<p class="muted" style="font-size:17px">${esc(ev.subtitle)}</p>` : ""}
      ${ev.intro ? `<p class="muted pre" style="margin-top:18px">${esc(ev.intro)}</p>` : ""}
    </section>

    ${ev.heroImage || photos.length ? `
    <section class="card">
      <h2>📸 活動照片</h2>
      ${ev.heroImage ? `<div class="photo-main"><img src="${esc(ev.heroImage)}" data-lb="${esc(ev.heroImage)}" alt="活動主視覺"></div>` : ""}
      ${photos.length ? `<div class="gallery">${photos.map(p => `<img src="${esc(p)}" data-lb="${esc(p)}" loading="lazy" alt="活動照片">`).join("")}</div>` : ""}
    </section>` : ""}

    ${ev.video ? `<section class="card"><h2>🎬 活動影片</h2>${videoHtml(ev.video)}</section>` : ""}

    ${info.length || ev.fee ? `
    <section class="card">
      <h2>🌿 活動資訊</h2>
      ${info.map(i => `<div class="info-card"><div class="info-label">${esc(i.label)}</div><div class="info-value">${esc(i.value)}</div></div>`).join("")}
      ${ev.fee ? `<div class="info-card"><div class="info-label">報名費</div><div class="info-value">${esc(ev.fee)}</div></div>` : ""}
    </section>` : ""}

    <section class="card">
      <h2>🎉 我要參加！</h2>
      ${open
        ? `<p class="muted">登入 Google 後即可報名「${esc(ev.title)}」。</p>
           <a class="btn btn-primary" href="register.html?event=${encodeURIComponent(ev.id)}">🎉 報名「${esc(ev.title)}」</a>`
        : `<div class="closed-box">此活動目前未開放報名。<br>如有疑問請聯絡主辦單位。</div>`}
    </section>
  `;
}

function select(id) {
  currentId = id;
  history.replaceState(null, "", "#event=" + encodeURIComponent(id));
  renderTabs();
  renderEvent();
}

tabsEl.addEventListener("click", e => {
  const b = e.target.closest("[data-id]");
  if (b) select(b.dataset.id);
});
area.addEventListener("click", e => {
  const img = e.target.closest("[data-lb]");
  if (img) openLb(img.dataset.lb);
});

(async () => {
  try {
    events = (await loadEvents(db)).filter(e => e.status !== "draft");
    // 開放中的活動排前面
    events.sort((a, b) => (b.status === "open") - (a.status === "open") || (b.order || 0) - (a.order || 0));
    if (!events.length) {
      area.innerHTML = `<div class="card muted" style="text-align:center">目前沒有活動，敬請期待 ☀️</div>`;
      return;
    }
    const hash = decodeURIComponent((location.hash.match(/event=([^&]+)/) || [])[1] || "");
    select(events.some(e => e.id === hash) ? hash : events[0].id);
  } catch (err) {
    console.error(err);
    area.innerHTML = `<div class="card status error">活動載入失敗：${esc(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
