<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatayCelup之戰｜活動報名</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <section class="hero">
            <div class="badge">2026 EVENT</div>

            <h1>SatayCelup之戰</h1>

            <p class="subtitle">
                2026 活動報名系統
            </p >

            <div class="event-info">
                <div>
                    <span>活動費用</span>
                    <strong>RM168</strong>
                </div>

                <div>
                    <span>繳費日期</span>
                    <strong>05/09/2026 - 25/09/2026</strong>
                </div>
            </div>

            <button id="loginBtn" class="primary-btn">
                使用 Google 登入並開始報名
            </button>

            <p id="status" class="status"></p >

            <p class="notice">
                報名需要使用 Google 帳號登入，以確保每位參加者的資料正確。
            </p >
        </section>

    </main>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
