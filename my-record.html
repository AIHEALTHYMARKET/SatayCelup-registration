<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查詢／修改我的資料｜BS 活動報名中心</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<main class="container">

  <section class="card hero">
    <div class="badge">🔎 MY RECORDS</div>
    <h1>我的報名紀錄</h1>
    <p class="muted">登入 Google 後，查看你報名了哪些活動。<br>每個帳號只能查看自己的資料。</p>
  </section>

  <section class="card">
    <h2>🔐 Google 登入</h2>
    <button id="loginButton" class="btn-primary">使用 Google 登入</button>
    <button id="logoutButton" class="btn-secondary hidden">登出目前帳號</button>
    <div id="loginStatus" class="status">尚未登入。</div>
  </section>

  <section id="recordsSection" class="card hidden">
    <h2>📋 我報名的活動</h2>
    <div id="summary" class="muted"></div>
    <div id="recordsArea" class="muted" style="text-align:center;padding:20px">正在讀取資料……</div>
  </section>

  <a href="index.html" class="btn btn-secondary">← 返回活動頁</a>

  <footer class="footer">🏓 BS 活動報名中心<br><br><a href="privacy.html">🔒 隱私權政策</a></footer>
</main>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import {
  GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection, query, where, getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { esc, tsText, loadEvents, PRESET_FIELDS } from "./js/shared.js";

const $ = id => document.getElementById(id);

$("loginButton").onclick = async () => {
  try {
    $("loginButton").disabled = true;
    $("loginButton").textContent = "正在登入……";
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch (e) {
    $("loginStatus").className = "status error";
    $("loginStatus").textContent = "登入失敗：" + (e.message || "請稍後再試。");
  } finally {
    $("loginButton").disabled = false;
    $("loginButton").textContent = "使用 Google 登入";
  }
};
$("logoutButton").onclick = () => signOut(auth).catch(() => alert("登出失敗，請稍後再試。"));

function row(label, value) {
  return `<div class="record-row"><div class="record-label">${esc(label)}</div><div class="record-value">${esc(value || "—")}</div></div>`;
}

function renderRecord(r, ev) {
  const fields = ev ? (ev.fields || []) : PRESET_FIELDS;
  const title = ev ? ev.title : (r.eventTitle || "未分類活動（舊資料）");
  const status = ev ? (ev.status === "open" ? "報名中" : ev.status === "closed" ? "已截止" : "") : "";
  let html = `<div class="record"><div class="record-title"><span>🎉 ${esc(title)}</span>` +
    (status ? `<span class="badge" style="font-size:12px;background:#e7f5dc;color:#4d8059;padding:4px 10px;border-radius:99px">${status}</span>` : "") + `</div>`;
  html += row("Google Email", r.email);
  fields.forEach(f => { if (r[f.key] !== undefined || !ev) html += row(f.label, r[f.key]); });
  if (r.platinum) html += row("所屬 Platinum", r.platinum);
  if (r.receiptFileId || r.receiptDriveUrl) html += row("繳費收據", "已上傳 ✅");
  html += row("提交時間", tsText(r.createdAt));
  if (ev) html += `<a class="btn btn-primary" style="margin-top:12px" href="register.html?edit=${encodeURIComponent(r.id)}">✏️ 修改這筆資料</a>`;
  else html += `<div class="muted" style="margin-top:10px">此為舊資料，如需修改請聯絡管理員。</div>`;
  return html + `</div>`;
}

async function loadAll(user) {
  const area = $("recordsArea");
  area.className = "muted"; area.textContent = "正在讀取你的資料……";
  try {
    const [events, snap] = await Promise.all([
      loadEvents(db),
      getDocs(query(collection(db, "registrations"), where("email", "==", user.email)))
    ]);
    const evMap = Object.fromEntries(events.map(e => [e.id, e]));
    const records = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(r => r.uid === user.uid)
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

    area.className = ""; area.style.padding = "0"; area.style.textAlign = "left";
    if (!records.length) {
      area.innerHTML = `<div class="closed-box">目前找不到你的報名資料。<br>如果剛完成提交，請稍候再重新整理。</div>`;
      $("summary").textContent = "";
      return;
    }

    // 依活動分組
    const groups = new Map();
    records.forEach(r => {
      const k = r.eventId && evMap[r.eventId] ? r.eventId : "__other";
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(r);
    });

    $("summary").innerHTML = "你一共報名了 <b>" + [...groups.keys()].filter(k => k !== "__other").length +
      "</b> 個活動，共 <b>" + records.length + "</b> 筆資料。";

    area.innerHTML = [...groups.entries()].map(([k, list]) => {
      const ev = evMap[k];
      return list.map(r => renderRecord(r, ev)).join("");
    }).join("");
  } catch (e) {
    console.error(e);
    area.className = "status error";
    area.textContent = "讀取資料失敗：" + (e.message || "請稍後再試。");
  }
}

onAuthStateChanged(auth, async user => {
  if (user) {
    $("loginButton").classList.add("hidden");
    $("logoutButton").classList.remove("hidden");
    $("recordsSection").classList.remove("hidden");
    $("loginStatus").className = "status success";
    $("loginStatus").textContent = "已登入：" + (user.email || "Google 帳號");
    await loadAll(user);
  } else {
    $("loginButton").classList.remove("hidden");
    $("logoutButton").classList.add("hidden");
    $("recordsSection").classList.add("hidden");
    $("loginStatus").className = "status";
    $("loginStatus").textContent = "尚未登入。";
  }
});
</script>
</body>
</html>
