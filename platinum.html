<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatayCelup之戰｜Platinum 專屬</title>

  <style>
    :root{
      --mint:#dff5e8;
      --mint-dark:#247a55;
      --orange:#f28b45;
      --yellow:#fff3bd;
      --cream:#fffaf0;
      --text:#26352d;
      --muted:#718078;
      --border:#dce8df;
      --white:#ffffff;
      --danger:#c84b4b;
      --blue:#477fc5;
      --shadow:0 10px 30px rgba(38,53,45,.08);
      --radius:18px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left,#e8f8ee 0,#fffaf0 38%,#fffaf0 100%);
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    .container{
      max-width:1500px;
      margin:auto;
      padding:24px;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar{
      background:rgba(255,255,255,.92);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px 22px;
      box-shadow:var(--shadow);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
      backdrop-filter:blur(10px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .brand-icon{
      width:52px;
      height:52px;
      border-radius:15px;
      background:var(--mint);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
    }

    .brand h1{
      margin:0;
      font-size:23px;
    }

    .brand p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .user-area{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .user-info{
      text-align:right;
    }

    .user-name{
      font-weight:800;
      color:var(--mint-dark);
    }

    .user-email{
      color:var(--muted);
      font-size:12px;
      margin-top:3px;
    }

    .logout-btn{
      border:0;
      background:#f6eeee;
      color:var(--danger);
      padding:10px 15px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
    }

    .logout-btn:hover{
      opacity:.85;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-card{
      max-width:520px;
      margin:70px auto;
      background:rgba(255,255,255,.96);
      border:1px solid var(--border);
      border-radius:24px;
      padding:40px;
      box-shadow:var(--shadow);
      text-align:center;
    }

    .login-icon{
      font-size:55px;
      margin-bottom:15px;
    }

    .login-card h2{
      margin:0 0 10px;
      font-size:28px;
    }

    .login-card p{
      color:var(--muted);
      line-height:1.7;
    }

    .google-btn{
      width:100%;
      border:1px solid var(--border);
      background:white;
      color:var(--text);
      padding:14px;
      border-radius:14px;
      cursor:pointer;
      font-weight:800;
      margin-top:20px;
      box-shadow:0 4px 12px rgba(0,0,0,.04);
    }

    .google-btn:hover{
      background:#fafafa;
    }

    /* =========================
       ERROR
    ========================= */

    .alert{
      display:none;
      padding:14px 18px;
      border-radius:14px;
      margin-bottom:18px;
      line-height:1.6;
    }

    .alert.show{
      display:block;
    }

    .alert.error{
      background:#fff0f0;
      color:#a33;
      border:1px solid #f1caca;
    }

    .alert.success{
      background:#eefaf3;
      color:#216a48;
      border:1px solid #ccebd9;
    }

    .alert.warning{
      background:#fff9df;
      color:#806b16;
      border:1px solid #f1e3a5;
    }

    /* =========================
       MAIN
    ========================= */

    #app{
      display:none;
    }

    .welcome{
      background:linear-gradient(135deg,#e8f8ee,#fff7df);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:22px 24px;
      margin-bottom:20px;
    }

    .welcome h2{
      margin:0 0 7px;
      font-size:25px;
    }

    .welcome p{
      margin:0;
      color:var(--muted);
    }

    /* =========================
       STATS
    ========================= */

    .stats{
      display:grid;
      grid-template-columns:repeat(8,1fr);
      gap:12px;
      margin-bottom:22px;
    }

    .stat{
      background:var(--white);
      border:1px solid var(--border);
      border-radius:16px;
      padding:17px 12px;
      box-shadow:0 5px 18px rgba(38,53,45,.05);
      min-width:0;
    }

    .stat-label{
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }

    .stat-value{
      margin-top:7px;
      font-size:25px;
      font-weight:900;
    }

    .stat:first-child{
      background:var(--mint);
    }

    /* =========================
       TABS
    ========================= */

    .tabs{
      display:flex;
      gap:8px;
      background:#eef5f0;
      border-radius:14px;
      padding:5px;
      margin-bottom:18px;
    }

    .tab{
      border:0;
      background:transparent;
      padding:11px 18px;
      border-radius:10px;
      cursor:pointer;
      font-weight:800;
      color:var(--muted);
    }

    .tab.active{
      background:white;
      color:var(--mint-dark);
      box-shadow:0 3px 10px rgba(0,0,0,.05);
    }

    /* =========================
       FILTER
    ========================= */

    .filter-card{
      background:white;
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:18px;
      margin-bottom:18px;
      box-shadow:var(--shadow);
    }

    .filter-grid{
      display:grid;
      grid-template-columns:2fr 1fr 1fr 1fr;
      gap:12px;
    }

    .field label{
      display:block;
      color:var(--muted);
      font-size:12px;
      margin-bottom:6px;
      font-weight:700;
    }

    .field input,
    .field select{
      width:100%;
      border:1px solid var(--border);
      border-radius:11px;
      padding:11px 12px;
      outline:none;
      background:white;
      color:var(--text);
    }

    .field input:focus,
    .field select:focus{
      border-color:var(--mint-dark);
    }

    /* =========================
       TABLE
    ========================= */

    .table-card{
      background:white;
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .table-header{
      padding:18px 20px;
      border-bottom:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
    }

    .table-header h3{
      margin:0;
    }

    .count{
      color:var(--muted);
      font-size:13px;
    }

    .table-wrap{
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1150px;
    }

    th,
    td{
      padding:12px 10px;
      border-bottom:1px solid #edf2ee;
      text-align:left;
      vertical-align:middle;
      font-size:13px;
    }

    th{
      background:#f7faf8;
      color:#596960;
      font-size:12px;
      white-space:nowrap;
      position:sticky;
      top:0;
      z-index:1;
    }

    tr:hover td{
      background:#fcfefd;
    }

    td input,
    td select{
      width:100%;
      min-width:100px;
      border:1px solid var(--border);
      border-radius:8px;
      padding:8px;
      background:white;
      color:var(--text);
      outline:none;
    }

    td input:focus,
    td select:focus{
      border-color:var(--mint-dark);
    }

    .readonly{
      color:var(--muted);
      word-break:break-word;
    }

    .save-btn{
      border:0;
      background:var(--mint-dark);
      color:white;
      padding:8px 12px;
      border-radius:9px;
      cursor:pointer;
      font-weight:800;
      white-space:nowrap;
    }

    .save-btn:hover{
      opacity:.88;
    }

    .save-btn:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

    .empty{
      padding:50px 20px;
      text-align:center;
      color:var(--muted);
    }

    .loading{
      padding:50px 20px;
      text-align:center;
      color:var(--muted);
    }

    .badge{
      display:inline-block;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      background:var(--yellow);
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:1200px){
      .stats{
        grid-template-columns:repeat(4,1fr);
      }

      .filter-grid{
        grid-template-columns:2fr 1fr 1fr;
      }
    }

    @media(max-width:760px){

      .container{
        padding:12px;
      }

      .topbar{
        padding:15px;
        align-items:flex-start;
      }

      .brand h1{
        font-size:18px;
      }

      .brand p{
        font-size:12px;
      }

      .brand-icon{
        width:44px;
        height:44px;
        font-size:23px;
      }

      .user-area{
        flex-direction:column;
        align-items:flex-end;
      }

      .user-info{
        display:none;
      }

      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .filter-grid{
        grid-template-columns:1fr;
      }

      .welcome h2{
        font-size:21px;
      }

      .tabs{
        overflow-x:auto;
      }

      .tab{
        white-space:nowrap;
      }

      .login-card{
        margin:35px auto;
        padding:28px 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginSection">

    <div class="login-card">

      <div class="login-icon">💎</div>

      <h2>Platinum 專屬管理</h2>

      <p>
        SatayCelup之戰<br>
        請使用你的 Google 帳號登入。
      </p>

      <p style="font-size:13px;">
        系統會自動辨識你的 Platinum 身份，
        你只能查看自己的團隊資料。
      </p>

      <button
        id="googleLoginBtn"
        class="google-btn">
        🔐 使用 Google 帳號登入
      </button>

    </div>

  </section>


  <!-- =========================
       APP
  ========================== -->

  <section id="app">

    <!-- TOPBAR -->

    <div class="topbar">

      <div class="brand">

        <div class="brand-icon">
          🍢
        </div>

        <div>

      <div class="user-area">

          </div>

          <div
            id="userEmail"

          </div>

        </div>

        <button
          id="logoutBtn"

          登出
        </button>

      </div>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="alert">
    </div>


    <!-- WELCOME -->

    <div class="welcome">

      <h2>
        💎 <span id="welcomeName"></span>

      </h2>

      <p>
        以下資料只屬於你的團隊。

    <!-- STATS -->

    <div class="stats">

        <div

        </div>
      </div>

      <div class="stat">
        <div class="stat-label">只買衣服</div>
        <div
          class="stat-value"

          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">衣服總數</div>
        <div
          class="stat-value"
          id="totalShirts">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">葷食</div>
        <div
          class="stat-value"
          id="totalMeat">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">素食</div>
        <div
          class="stat-value"
          id="totalVegetarian">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">羽球</div>
        <div
          class="stat-value"

        </div>
      </div>

      <div class="stat">
        <div class="stat-label">Pickleball</div>

          class="stat-value"

      </div>

      <div class="stat">
        <div class="stat-label">觀眾</div>
        <div
          class="stat-value"

          0
        </div>
      </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

      <button
        class="tab active"
        id="registrationTab">
        📋 出席報名
      </button>

      <button
        class="tab"
        id="orderTab">
        👕 衣服訂單
      </button>

    </div>


    <!-- FILTER -->

    <div class="filter-card">

      <div class="filter-grid">

        <div class="field">

          <label>
            🔎 搜尋
          </label>

          <input
            id="searchInput"
            type="text"
            placeholder="姓名、IC、電話、Email、球伴..."
          >

        </div>


        <div
          class="field"
          id="mealFilterBox">

          <label>
            飲食
          </label>

          <select id="mealFilter">

            <option value="">
              全部
            </option>

            <option value="葷食">
              葷食
            </option>

            <option value="素食">
              素食
            </option>

          </select>

        </div>


        <div
          class="field"
          id="participationFilterBox">

          <label>
            參與項目
          </label>

          <select id="participationFilter">

            <option value="">
              全部
            </option>

            <option value="羽球">
              羽球
            </option>

            <option value="pickleball">
              Pickleball
            </option>

            <option value="觀眾">

            </option>

          </select>

        </div>


        <div class="field">

          <label>
            衣服尺寸
          </label>

          <select id="shirtSizeFilter">

            <option value="">
              全部
            </option>

            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="2XL">2XL</option>
            <option value="3XL">3XL</option>
            <option value="4XL">4XL</option>

          </select>

        </div>

      </div>

    </div>


    <!-- REGISTRATION TABLE -->

    <div
      id="registrationPanel"
      class="table-card">

      <div class="table-header">

        <h3>
          📋 我的團隊報名資料
        </h3>

        <div
          id="registrationCount"
          class="count">
          0 筆
        </div>

      </div>

      <div
        id="registrationTable">
      </div>

    </div>


    <!-- ORDER TABLE -->

    <div
      id="orderPanel"
      class="table-card"
      style="display:none;">

      <div class="table-header">

        <h3>
          👕 我的團隊衣服訂單
        </h3>

        <div
          id="orderCount"
          class="count">
          0 筆
        </div>

      </div>

      <div
        id="orderTable">
      </div>

    </div>

  </section>

</div>


<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc
  } from
  "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =========================================
     FIREBASE
  ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCWaQbWLteRDMiGcyTdfJanDiuSiPUFdeU",

    authDomain:
      "sataycelup-registration-af033.firebaseapp.com",

    projectId:
      "sataycelup-registration-af033",

    storageBucket:
      "sataycelup-registration-af033.firebasestorage.app",

    messagingSenderId:
      "485590570714",

    appId:
      "1:485590570714:web:d693b857a99e5bf821f7e3"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =========================================
     11 位 PLATINUM UID
  ========================================= */

  const PLATINUM_UIDS = {

    "Sense&Lavenier":
      "2rNB2dEMwYeDxMPHxJGMq9F7vHU2",

    "Amos":
      "ZzWLiS9wR7dOy4lwpW9E3PxmNiE2",

    "Sunny":
      "TZHOLfx55dRfomerJJL1ZaxdfMm1",

    "Robin&Zoey":
      "NV6OKbVKe7QSX06nKUUEGhoBae32",

    "RyanLio":
      "cqW7ZHpWsmdjsc1zJiAL9MhRlIA2",

    "Wyane&Momo":
      "Zn6rj5cQ84P6wiPr6QpvFhACXkV2",

    "Jess":
      "6iYJHVztThdgj4jpN3pdewzUDbE2",

    "Keong&Ngah":
      "Zgil7YpCJsdD4qT5oAmfI0vLBl53",

    "JayChew":
      "UALJAeujRXazWubxSTRsFo5OxwI3",

    "Lynn":
      "x7Kp4XNKcBV4MzHIG7DBdwnSYWV2",

    "SzeChew":
      "hY1QzYljziQsprfbFFowNteqmuH2"

  };


  /* =========================================
     STATE
  ========================================= */

  let currentUser = null;

  let currentPlatinum = null;

  let registrations = [];

  let shirtOrders = [];

  let currentTab = "registrations";


  /* =========================================
     DOM
  ========================================= */

  const loginSection =
    document.getElementById("loginSection");

  const appSection =
    document.getElementById("app");

  const googleLoginBtn =
    document.getElementById("googleLoginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const message =
    document.getElementById("message");


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(
    text,
    type = "success"
  ){

    message.textContent = text;

    message.className =
      "alert show " + type;

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    setTimeout(() => {

      message.className =
        "alert";

    },5000);

  }


  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHtml(value){

    if(
      value === null ||
      value === undefined
    ){
      return "";
    }

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  /* =========================================
     FIND PLATINUM NAME
  ========================================= */

  function getPlatinumNameByUid(uid){

    for(
      const [name, platinumUid]
      of Object.entries(PLATINUM_UIDS)
    ){

      if(platinumUid === uid){
        return name;
      }

    }

    return null;

  }


  /* =========================================
     GOOGLE LOGIN
  ========================================= */

  googleLoginBtn.addEventListener(
    "click",
    async () => {

      try{

        googleLoginBtn.disabled = true;

        googleLoginBtn.textContent =
          "登入中...";

        const provider =
          new GoogleAuthProvider();

        await signInWithPopup(
          auth,
          provider
        );

      }catch(error){

        console.error(error);

        showMessage(
          "Google 登入失敗：" +
          error.message,
          "error"
        );

      }finally{

        googleLoginBtn.disabled = false;

        googleLoginBtn.textContent =
          "🔐 使用 Google 帳號登入";

      }

    }
  );


  /* =========================================
     AUTH STATE
  ========================================= */

  onAuthStateChanged(
    auth,
    async (user) => {

      if(!user){

        currentUser = null;
        currentPlatinum = null;

        loginSection.style.display =
          "block";

        appSection.style.display =
          "none";

        return;

      }


      const platinumName =
        getPlatinumNameByUid(user.uid);


      /* -------------------------------------
         不是 Platinum
      ------------------------------------- */

      if(!platinumName){

        showMessage(
          "此 Google 帳號不是 Platinum 系統帳號。",
          "error"
        );

        await signOut(auth);

        return;

      }


      /* -------------------------------------
         是 Platinum
      ------------------------------------- */

      currentUser = user;

      currentPlatinum = platinumName;


      document.getElementById(
        "platinumName"
      ).textContent =
        platinumName;

      document.getElementById(
        "welcomeName"
      ).textContent =
        platinumName;

      document.getElementById(
        "userEmail"
      ).textContent =
        user.email || "";


      loginSection.style.display =
        "none";

      appSection.style.display =
        "block";


      await loadAllData();

    }

  );


  /* =========================================
     LOAD DATA
  ========================================= */

  async function loadAllData(){

    try{

      showMessage(
        "正在載入你的團隊資料...",
        "warning"
      );


      await Promise.all([
        loadRegistrations(),
        loadShirtOrders()
      ]);


      updateStats();

      renderRegistrations();

      renderShirtOrders();


      message.className =
        "alert";


    }catch(error){

      console.error(error);

      let errorText =
        "資料載入失敗。";


      if(
        error.code ===
        "permission-denied"
      ){

        errorText =
          "資料權限被拒絕。請確認 Firestore Rules 已更新，並確認報名資料有正確的 platinumUid。";

      }else if(
        error.code ===
        "failed-precondition"
      ){

        errorText =
          "Firestore 查詢設定出現問題，請檢查 Firebase 設定。";

      }else{

        errorText +=
          " " + error.message;

      }


      showMessage(
        errorText,
        "error"
      );

    }

  }


  /* =========================================
     LOAD REGISTRATIONS
  ========================================= */

  async function loadRegistrations(){

    if(!currentUser){
      return;
    }


    const q =
      query(
        collection(
          db,
          "registrations"
        ),
        where(
          "platinumUid",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(q);


    registrations =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    registrations.sort(
      sortByCreatedAt
    );

  }


  /* =========================================
     LOAD SHIRT ORDERS
  ========================================= */

  async function loadShirtOrders(){

    if(!currentUser){
      return;
    }


    const q =
      query(
        collection(
          db,
          "shirtOrders"
        ),
        where(
          "platinumUid",
          "==",
          currentUser.uid
        )
      );


    const snapshot =
      await getDocs(q);


    shirtOrders =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    shirtOrders.sort(
      sortByCreatedAt
    );

  }


  /* =========================================
     SORT
  ========================================= */

  function sortByCreatedAt(a,b){

    const aTime =
      a.createdAt?.seconds || 0;

    const bTime =
      b.createdAt?.seconds || 0;

    return bTime - aTime;

  }


  /* =========================================
     UPDATE STATS
  ========================================= */

  function updateStats(){

    document.getElementById(
      "totalRegistrations"
    ).textContent =
      registrations.length;


    document.getElementById(
      "totalOrders"
    ).textContent =
      shirtOrders.length;


    let shirtTotal = 0;

    registrations.forEach(item => {

      if(item.shirtSize){
        shirtTotal++;
      }

    });


    shirtOrders.forEach(item => {

      if(item.shirtSize){

        const quantity =
          Number(item.quantity || 1);

        shirtTotal +=
          quantity;

      }

    });


    document.getElementById(
      "totalShirts"
    ).textContent =
      shirtTotal;


    const meat =
      registrations.filter(
        item => item.meal === "葷食"
      ).length;


    const vegetarian =
      registrations.filter(
        item => item.meal === "素食"
      ).length;


    const badminton =
      registrations.filter(
        item => item.participation === "羽球"
      ).length;


    const pickleball =
      registrations.filter(
        item =>
          item.participation === "pickleball"
      ).length;


    const audience =
      registrations.filter(
        item =>
          item.participation === "觀眾"
      ).length;


    document.getElementById(
      "totalMeat"
    ).textContent =
      meat;


    document.getElementById(
      "totalVegetarian"
    ).textContent =
      vegetarian;


    document.getElementById(
      "totalBadminton"
    ).textContent =
      badminton;


    document.getElementById(
      "totalPickleball"
    ).textContent =
      pickleball;


    document.getElementById(
      "totalAudience"
    ).textContent =
      audience;

  }


  /* =========================================
     SEARCH
  ========================================= */

  function getSearchText(item){

    return [

      item.englishName,
      item.chineseName,
      item.icNumber,
      item.phone,
      item.email,
      item.partnerGroup,
      item.partner,
      item.googleName,
      item.shirtText

    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

  }


  function getFilteredRegistrations(){

    const search =
      document.getElementById(
        "searchInput"
      ).value
      .trim()
      .toLowerCase();


    const meal =
      document.getElementById(
        "mealFilter"
      ).value;


    const participation =
      document.getElementById(
        "participationFilter"
      ).value;


    const shirtSize =
      document.getElementById(
        "shirtSizeFilter"
      ).value;


    return registrations.filter(item => {

      if(
        search &&
        !getSearchText(item)
          .includes(search)
      ){
        return false;
      }


      if(
        meal &&
        item.meal !== meal
      ){
        return false;
      }


      if(
        participation &&
        item.participation !== participation
      ){
        return false;
      }


      if(
        shirtSize &&
        item.shirtSize !== shirtSize
      ){
        return false;
      }


      return true;

    });

  }


  function getFilteredOrders(){

    const search =
      document.getElementById(
        "searchInput"
      ).value
      .trim()
      .toLowerCase();


    const shirtSize =
      document.getElementById(
        "shirtSizeFilter"
      ).value;


    return shirtOrders.filter(item => {

      if(
        search &&
        !getSearchText(item)
          .includes(search)
      ){
        return false;
      }


      if(
        shirtSize &&
        item.shirtSize !== shirtSize
      ){
        return false;
      }


      return true;

    });

  }

  /* =========================================

  function shirtSizeOptions(selected){

    const sizes = [
      "XS",
      "S",
      "M",
      "L",
      "XL",
      "2XL",
      "3XL",
      "4XL"
    ];


    return sizes.map(size => `

      <option
        value="${size}"
        ${selected === size ? "selected" : ""}>
        ${size}
      </option>

    `).join("");

  }

  /* =========================================
     SAVE REGISTRATION
  ========================================= */

  async function saveRegistration(
    row,
    button
  ){

    const id =
      row.dataset.id;


    const updateData = {

      englishName:
        row.querySelector(
          '[data-field="englishName"]'
        ).value.trim(),

      icNumber:
        row.querySelector(
          '[data-field="icNumber"]'
        ).value.trim(),

      chineseName:
        row.querySelector(
          '[data-field="chineseName"]'
        ).value.trim(),

      phone:
        row.querySelector(
          '[data-field="phone"]'
        ).value.trim(),

      meal:
        row.querySelector(
          '[data-field="meal"]'
        ).value,

      shirtSize:
        row.querySelector(
          '[data-field="shirtSize"]'
        ).value,

      shirtText:
        row.querySelector(
          '[data-field="shirtText"]'
        ).value.trim(),

      participation:
        row.querySelector(
          '[data-field="participation"]'
        ).value,

      partnerGroup:
        row.querySelector(
          '[data-field="partnerGroup"]'
        ).value.trim(),

      partner:
        row.querySelector(
          '[data-field="partner"]'
        ).value.trim()

    };


    button.disabled = true;

    button.textContent =
      "儲存中...";


    try{

      await updateDoc(
        doc(
          db,
          "registrations",
          id
        ),
        updateData
      );


      const index =
        registrations.findIndex(
          item => item.id === id
        );


      if(index !== -1){

        registrations[index] = {

          ...registrations[index],

          ...updateData

        };

      }


      updateStats();

      showMessage(
        "資料已成功更新。",
        "success"
      );


    }catch(error){

      console.error(error);

      showMessage(
        "更新失敗：" +
        error.message,
        "error"
      );

    }finally{

      button.disabled = false;

      button.textContent =
        "儲存";

    }

  }


  /* =========================================
     SAVE SHIRT ORDER
  ========================================= */

  async function saveShirtOrder(
    row,
    button
  ){

    const id =
      row.dataset.id;


    const quantity =
      Math.max(
        1,
        Number(
          row.querySelector(
            '[data-field="quantity"]'
          ).value || 1
        )
      );


    const updateData = {

      googleName:
        row.querySelector(
          '[data-field="googleName"]'
        ).value.trim(),

      chineseName:
        row.querySelector(
          '[data-field="chineseName"]'
        ).value.trim(),

      phone:
        row.querySelector(
          '[data-field="phone"]'
        ).value.trim(),

      shirtSize:
        row.querySelector(
          '[data-field="shirtSize"]'
        ).value,

      quantity:

        quantity,

      shirtText:
        row.querySelector(
          '[data-field="shirtText"]'
        ).value.trim()

    };


    button.disabled = true;

    button.textContent =
      "儲存中...";


    try{

      await updateDoc(
        doc(
          db,
          "shirtOrders",
          id
        ),
        updateData
      );


      const index =
        shirtOrders.findIndex(
          item => item.id === id
        );


      if(index !== -1){

        shirtOrders[index] = {

          ...shirtOrders[index],

          ...updateData

        };

      }


      updateStats();

      showMessage(
        "衣服訂單已成功更新。",
        "success"
      );


    }catch(error){

      console.error(error);

      showMessage(
        "更新失敗：" +
        error.message,
        "error"
      );

    }finally{

      button.disabled = false;

      button.textContent =
        "儲存";

    }

  }


  /* =========================================
     EVENT DELEGATION
  ========================================= */

  document.addEventListener(
    "click",
    async event => {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if(!button){
        return;
      }


      const row =
        button.closest("tr");


      if(!row){
        return;
      }


      const action =
        button.dataset.action;


      if(
        action ===
        "save-registration"
      ){

        await saveRegistration(
          row,
          button
        );

      }


      if(
        action ===
        "save-order"
      ){

        await saveShirtOrder(
          row,
          button
        );

      }

    }
  );
