<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platinum 專屬｜BS 活動報名</title>
<link rel="stylesheet" href="css/manage.css">
</head>
<body>
<div class="page">

  <!-- 登入 -->
  <section id="loginSection">
    <div class="login-card">
      <div class="emoji">💎</div>
      <h2>Platinum 專屬管理</h2>
      <p>請使用你的 Email 與密碼登入。<br>登入後只能查看自己團隊的資料。</p>
      <div id="loginMessage"></div>
      <form id="loginForm" class="login-form">
        <label for="emailInput">Email</label>
        <input id="emailInput" type="email" autocomplete="email" required>
        <label for="passwordInput">密碼</label>
        <input id="passwordInput" type="password" autocomplete="current-password" required>
        <button class="btn btn-primary" style="width:100%" id="loginBtn" type="submit">🔐 登入 Platinum 系統</button>
      </form>
      <button class="btn btn-secondary" style="margin-top:12px" id="forgotBtn" type="button">忘記密碼？</button>
    </div>
  </section>

  <!-- 主畫面 -->
  <section id="app" class="hidden">
    <div class="topbar">
      <div class="brand">
        <div class="brand-icon">💎</div>
        <div><h1><span id="ptName"></span> 團隊</h1><div class="subtitle" id="ptEmail"></div></div>
      </div>
      <div class="top-actions"><button class="btn btn-secondary" id="logoutBtn">登出</button></div>
    </div>

    <div id="messageBox"></div>

    <div class="section-card">
      <div class="section-title">
        <h2>我的團隊報名資料</h2>
        <div class="field" style="min-width:260px;margin:0"><select id="eventSelect"></select></div>
      </div>

      <div class="stats">
        <div class="stat-card"><div class="stat-label">此活動團隊報名</div><div class="stat-number" id="statTotal">0</div></div>
        <div class="stat-card"><div class="stat-label">所有活動合計</div><div class="stat-number" id="statAll">0</div></div>
      </div>
      <div id="fieldStats" style="margin-bottom:14px"></div>

      <div class="filters" style="grid-template-columns:minmax(220px,1fr)">
        <div class="field"><label>🔎 搜尋</label><input id="search" type="search" placeholder="姓名、電話、Email、任何欄位..."></div>
      </div>

      <div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
      <div class="footer-note">你可以修改報名者資料，但無法更改團隊歸屬或刪除資料。</div>
    </div>
  </section>
</div>

<script type="module">
import {
  signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection, query, where, getDocs, updateDoc, doc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import { auth, db } from "./js/firebase-config.js";
import {
  PLATINUM_UIDS, LEGACY_EVENT, esc, tsText, loadEvents, controlHtml, readValues, statsHtml
} from "./js/shared.js";

const $ = id => document.getElementById(id);
let user = null, events = [], regs = [], eventId = "";

function showMessage(text, type = "success") {
  $("messageBox").innerHTML = `<div class="notice notice-${type}">${esc(text)}</div>`;
  setTimeout(() => $("messageBox").innerHTML = "", 5000);
}
function loginMsg(text, type = "error") {
  $("loginMessage").innerHTML = text ? `<div class="notice notice-${type}">${esc(text)}</div>` : "";
}
function authError(e) {
  const m = {
    "auth/invalid-credential": "Email 或密碼錯誤。",
    "auth/invalid-login-credentials": "Email 或密碼錯誤。",
    "auth/user-not-found": "找不到這個 Email 帳號。",
    "auth/wrong-password": "密碼錯誤。",
    "auth/invalid-email": "Email 格式不正確。",
    "auth/too-many-requests": "登入嘗試次數過多，請稍後再試。",
    "auth/network-request-failed": "網路連線失敗。"
  };
  return m[e.code] || ("登入失敗：" + (e.message || "未知錯誤"));
}

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  loginMsg("");
  $("loginBtn").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("emailInput").value.trim(), $("passwordInput").value); }
  catch (err) { loginMsg(authError(err)); }
  $("loginBtn").disabled = false;
});

$("forgotBtn").onclick = async () => {
  const email = $("emailInput").value.trim();
  if (!email) return loginMsg("請先輸入 Email 再點「忘記密碼」。", "warning");
  try { await sendPasswordResetEmail(auth, email); loginMsg("密碼重設信已寄出，請到信箱收取。", "success"); }
  catch (err) { loginMsg(authError(err)); }
};

$("logoutBtn").onclick = async () => { await signOut(auth); regs = []; };

onAuthStateChanged(auth, async u => {
  if (!u) {
    user = null;
    $("loginSection").classList.remove("hidden");
    $("app").classList.add("hidden");
    return;
  }
  const name = Object.entries(PLATINUM_UIDS).find(([, uid]) => uid === u.uid)?.[0];
  if (!name) {
    await signOut(auth);
    loginMsg("這個帳號不是系統登記的 Platinum 帳號。");
    return;
  }
  user = u;
  $("ptName").textContent = name;
  $("ptEmail").textContent = u.email || "";
  $("loginSection").classList.add("hidden");
  $("app").classList.remove("hidden");
  await loadData();
});

async function loadData() {
  try {
    const [evs, snap] = await Promise.all([
      loadEvents(db),
      getDocs(query(collection(db, "registrations"), where("platinumUid", "==", user.uid)))
    ]);
    events = evs;
    regs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    regs.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderSelect();
    render();
  } catch (e) {
    console.error(e);
    showMessage(e.code === "permission-denied"
      ? "資料權限被拒絕，請確認 Firestore Rules 與報名資料的 platinumUid。"
      : "資料載入失敗：" + (e.message || ""), "error");
  }
}

// 只列出「有 Platinum 功能的活動」及「團隊有資料的活動」
function visibleEvents() {
  const list = events.filter(e => e.platinumEnabled || regs.some(r => r.eventId === e.id));
  if (regs.some(r => !r.eventId)) list.push(LEGACY_EVENT);
  return list;
}

function renderSelect() {
  const list = visibleEvents();
  $("eventSelect").innerHTML = list.map(e => {
    const n = regs.filter(r => (e.id === LEGACY_EVENT.id ? !r.eventId : r.eventId === e.id)).length;
    return `<option value="${esc(e.id)}">${esc(e.title)}（${n}）</option>`;
  }).join("") || `<option value="">（尚無活動）</option>`;
  if (!list.some(e => e.id === eventId)) {
    // 預設選有資料的第一個活動
    eventId = (list.find(e => regs.some(r => e.id === LEGACY_EVENT.id ? !r.eventId : r.eventId === e.id)) || list[0])?.id || "";
  }
  $("eventSelect").value = eventId;
}
$("eventSelect").onchange = () => { eventId = $("eventSelect").value; render(); };
$("search").oninput = render;

function render() {
  $("statAll").textContent = regs.length;
  const ev = visibleEvents().find(e => e.id === eventId);
  if (!ev) {
    $("statTotal").textContent = 0;
    $("fieldStats").innerHTML = "";
    $("head").innerHTML = "";
    $("body").innerHTML = `<tr><td class="empty">目前沒有資料。</td></tr>`;
    return;
  }
  const all = regs.filter(r => ev.id === LEGACY_EVENT.id ? !r.eventId : r.eventId === ev.id);
  $("statTotal").textContent = all.length;
  const fields = ev.fields || [];
  $("fieldStats").innerHTML = statsHtml(fields, all);

  const kw = $("search").value.trim().toLowerCase();
  const list = all.filter(r => !kw ||
    [r.email, r.googleName, ...fields.map(f => r[f.key])].join(" ").toLowerCase().includes(kw));

  $("head").innerHTML = `<tr><th>#</th><th>Google</th>` +
    fields.map(f => `<th>${esc(f.label)}</th>`).join("") +
    `<th>報名時間</th><th>操作</th></tr>`;

  if (!list.length) {
    $("body").innerHTML = `<tr><td colspan="${fields.length + 4}" class="empty">📭 目前沒有符合條件的資料</td></tr>`;
    return;
  }
  $("body").innerHTML = list.map((r, i) => `
    <tr data-id="${esc(r.id)}">
      <td>${i + 1}</td>
      <td><div>${esc(r.googleName || "-")}</div><div class="readonly" style="font-size:11px">${esc(r.email || "")}</div></td>
      ${fields.map(f => `<td>${controlHtml(f, r[f.key], "cell")}</td>`).join("")}
      <td class="readonly">${esc(tsText(r.createdAt))}</td>
      <td><button class="btn btn-sm btn-primary" data-act="save">儲存</button></td>
    </tr>`).join("");
}

$("body").addEventListener("click", async e => {
  const btn = e.target.closest('[data-act="save"]');
  if (!btn) return;
  const tr = btn.closest("tr");
  const id = tr.dataset.id;
  const ev = visibleEvents().find(x => x.id === eventId);
  const r = regs.find(x => x.id === id);
  if (!ev || !r) return;
  const data = readValues(tr, ev.fields || []);
  btn.disabled = true; btn.textContent = "儲存中...";
  try {
    await updateDoc(doc(db, "registrations", id), data);
    Object.assign(r, data);
    showMessage("資料已成功更新。");
    render();
  } catch (err) {
    console.error(err);
    showMessage("更新失敗：" + (err.message || ""), "error");
    btn.disabled = false; btn.textContent = "儲存";
  }
});
</script>
</body>
</html>
