<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>活動衣服｜SatayCelup之戰</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #fffdf5 0%,
          #f1fff8 55%,
          #fffaf0 100%
        );

      color: #29443d;
      min-height: 100vh;
      line-height: 1.7;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .page {
      max-width: 720px;
      margin: auto;
      padding-bottom: 50px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 42px 22px 48px;
      text-align: center;

      background:
        radial-gradient(
          circle at 15% 20%,
          #fff0a8 0 45px,
          transparent 46px
        ),
        radial-gradient(
          circle at 90% 15%,
          #ffd98c 0 35px,
          transparent 36px
        ),
        linear-gradient(
          145deg,
          #dff8ed,
          #fff8d9
        );

      border-radius: 0 0 38px 38px;
    }

    .hero::before {
      content: "🍢";
      position: absolute;
      left: 18px;
      bottom: 15px;
      font-size: 42px;
      transform: rotate(-12deg);
    }

    .hero::after {
      content: "👕";
      position: absolute;
      right: 18px;
      bottom: 15px;
      font-size: 42px;
      transform: rotate(12deg);
    }

    .eyebrow {
      display: inline-block;
      background: rgba(255,255,255,.78);
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e97931;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: clamp(30px, 8vw, 46px);
      line-height: 1.15;
      color: #263f38;
      margin-bottom: 12px;
      font-weight: 900;
    }

    .hero p {
      font-size: 16px;
      color: #52736a;
      font-weight: 600;
    }

    /* =========================
       CONTENT
    ========================= */

    .content {
      padding: 20px 16px;
    }

    .card {
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(87,147,125,.12);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 10px 30px rgba(47,89,75,.08);
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 900;
      margin-bottom: 14px;
      color: #29483f;
    }

    /* =========================
       SHIRT PREVIEW
    ========================= */

    .shirt-preview {
      border-radius: 20px;
      min-height: 310px;

      background:
        linear-gradient(
          135deg,
          #f6fff9,
          #fff8dc
        );

      border: 2px dashed #b8dccc;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 30px 20px;
      margin-bottom: 18px;
    }

    .shirt-icon {
      font-size: 85px;
      margin-bottom: 10px;
    }

    .shirt-preview h2 {
      font-size: 22px;
      margin-bottom: 5px;
      color: #385b50;
    }

    .shirt-preview p {
      color: #7b968e;
      font-size: 14px;
    }

    .notice {
      background: #fff8d8;
      border-left: 5px solid #f5c94a;
      border-radius: 12px;
      padding: 14px 15px;
      color: #6f5b28;
      font-size: 14px;
    }

    .price {
      margin-top: 15px;
      text-align: center;
      font-size: 27px;
      font-weight: 900;
      color: #e8752e;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginSection {
      text-align: center;
    }

    .login-text {
      color: #648078;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .google-btn {
      width: 100%;
      border: none;
      background: #fff;
      color: #30433d;
      border: 1px solid #dce9e3;
      border-radius: 16px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(47,89,75,.08);
      transition: .2s;
    }

    .google-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(47,89,75,.12);
    }

    .google-icon {
      margin-right: 8px;
    }

    #userInfo {
      display: none;
    }

    .logged-user {
      background: #eafaf3;
      border-radius: 15px;
      padding: 12px 15px;
      font-size: 14px;
      color: #477267;
      margin-bottom: 18px;
    }

    .logged-user strong {
      color: #29483f;
    }

    /* =========================
       FORM
    ========================= */

    #formSection {
      display: none;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #36564d;
    }

    .required {
      color: #e8752e;
      margin-left: 3px;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1.5px solid #d8e8e1;
      background: #fbfffd;
      color: #304c44;
      border-radius: 14px;
      padding: 14px 15px;
      outline: none;
      transition: .2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: #79bca2;
      box-shadow: 0 0 0 4px rgba(121,188,162,.12);
      background: #fff;
    }

    .hint {
      font-size: 12px;
      color: #8aa098;
      margin-top: 6px;
    }

    /* =========================
       SIZE
    ========================= */

    .size-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 9px;
    }

    .size-option {
      position: relative;
    }

    .size-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .size-option label {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      border: 1.5px solid #d8e8e1;
      border-radius: 13px;
      background: #fbfffd;
      cursor: pointer;
      font-weight: 800;
      color: #58766d;
      margin: 0;
      transition: .2s;
    }

    .size-option input:checked + label {
      background: #dff6eb;
      border-color: #72b89b;
      color: #285847;
      box-shadow: 0 4px 12px rgba(80,150,120,.12);
    }

    /* =========================
       PLATINUM
    ========================= */

    .platinum-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 9px;
    }

    .platinum-option {
      position: relative;
    }

    .platinum-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .platinum-option label {
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 10px 12px;
      border: 1.5px solid #d8e8e1;
      border-radius: 13px;
      background: #fbfffd;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #58766d;
      margin: 0;
      transition: .2s;
    }

    .platinum-option input:checked + label {
      background: #fff3c4;
      border-color: #e7c64c;
      color: #715b1c;
    }

    /* =========================
       SUBMIT
    ========================= */

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 17px;
      padding: 16px;
      background:
        linear-gradient(
          135deg,
          #ef8b3b,
          #e56d2d
        );
      color: white;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(229,109,45,.22);
      transition: .2s;
      margin-top: 5px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(229,109,45,.28);
    }

    .submit-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       SUCCESS
    ========================= */

    #successSection {
      display: none;
      text-align: center;
    }

    .success-icon {
      font-size: 75px;
      margin-bottom: 10px;
    }

    .success-title {
      font-size: 27px;
      font-weight: 900;
      color: #2d6953;
      margin-bottom: 10px;
    }

    .success-text {
      color: #648078;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .action-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 900;
      margin-top: 10px;
      cursor: pointer;
      border: none;
    }

    .action-primary {
      background: #dff6eb;
      color: #2c654f;
    }

    .action-secondary {
      background: #fff1d5;
      color: #a35e27;
    }

    /* =========================
       BOTTOM
    ========================= */

    .bottom-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .bottom-actions a,
    .bottom-actions button {
      flex: 1;
      text-align: center;
      padding: 12px;
      border: none;
      border-radius: 13px;
      background: #f2f7f4;
      color: #648078;
      text-decoration: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      padding: 25px 20px 10px;
      color: #8ca39b;
      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width:480px){

      .hero {
        padding: 35px 18px 43px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .content {
        padding: 16px 12px;
      }

      .card {
        padding: 18px;
        border-radius: 21px;
      }

      .shirt-preview {
        min-height: 260px;
      }

      .size-grid {
        grid-template-columns: repeat(3,1fr);
      }

      .platinum-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<body>

<div class="page">

  <!-- HERO -->

  <section class="hero">

    <div class="eyebrow">
      👕 SATAYCELUP之戰 2026
    </div>

    <h1>
      活動衣服
    </h1>

    <p>
      就算不能來，也可以把這件紀念帶回家 ❤️
    </p>

  </section>


  <main class="content">

    <!-- 衣服介紹 -->

    <section class="card">

      <div class="card-title">
        👕 活動衣服

      <div class="logged-user">

        <strong id="userName">
          -

        <br>

        <span id="userEmail">
          -
        </span>

      </div>

    </section>


    <!-- FORM -->

    <section
      class="card"
      id="formSection">

      <div class="card-title">
        📝 衣服資料
      </div>

      <form id="shirtForm">

        <!-- 中文姓名 -->

        <div class="field">

          <label>
            中文姓名／匿名
            <span class="required">*</span>
          </label>

          <input
            type="text"

            placeholder="例如：陳大明／匿名"

        <!-- 電話 -->

        <div class="field">

        <!-- 尺寸 -->

        <div class="field">

          <label>

            <span class="required">*</span>
          </label>

          <div class="size-grid">

            <div class="size-option">

                type="radio"
                name="shirtSize"
                id="sizeXS"

              >
              <label for="sizeXS">XS</label>
            </div>

            <div class="size-option">

                type="radio"
                name="shirtSize"
                id="sizeS"
                value="S"

              <label for="sizeS">S</label>
            </div>

            <div class="size-option">
              <input
                type="radio"
                name="shirtSize"
                id="sizeM"
                value="M"
              >
              <label for="sizeM">M</label>
            </div>

            <div class="size-option">
              <input
                type="radio"
                name="shirtSize"
                id="sizeL"
                value="L"
              >
              <label for="sizeL">L</label>
            </div>

            <div class="size-option">
              <input
                type="radio"
                name="shirtSize"
                id="sizeXL"
                value="XL"

              <label for="sizeXL">XL</label>
            </div>

            <div class="size-option">
              <input
                type="radio"
                name="shirtSize"
                id="sizeXXL"
                value="XXL"

              <label for="sizeXXL">XXL</label>
            </div>

            <div class="size-option">
              <input
                type="radio"
                name="shirtSize"

                value="XXXL"

        <!-- 背面文字 -->

          <label>

          </label>

          <input

            id="shirtBack"

          >

          <div class="hint">
            最多 30 個字元，請確認文字拼寫。

        <!-- PLATINUM -->

        <div class="field">

          <label>
            👑 白金

            <div class="platinum-option">

                name="platinum"

            </div>

            <div class="platinum-option">

                name="platinum"

                value="Sunny"

              </label>
            </div>

            <div class="platinum-option">

                name="platinum"
                id="p4"

            </div>

            <div class="platinum-option">

            <div class="platinum-option">

            </div>

            <div class="platinum-option">

                name="platinum"
                id="p7"
                value="Jess"

              <label for="p7">

            </div>

            <div class="platinum-option">
              <input
                type="radio"
                name="platinum"
                id="p8"
                value="Keong&Ngah"
              >
              <label for="p8">

              </label>
            </div>

            <div class="platinum-option">
              <input
                type="radio"
                name="platinum"
                id="p9"
                value="JayChew"
              >
              <label for="p9">

              </label>

            <div class="platinum-option">
              <input
                type="radio"
                name="platinum"
                id="p10"
                value="Lynn"
              >
              <label for="p10">

            </div>

            <div class="platinum-option">
              <input
                type="radio"
                name="platinum"
                id="p11"
                value="SzeChew"
              >
              <label for="p11">
                SzeChew
              </label>
            </div>

          </div>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="submit-btn"
          id="submitBtn">

          👕 送出衣服訂單

        </button>

      </form>

    </section>


    <!-- SUCCESS -->

    <section
      class="card"
      id="successSection">

      <div class="success-icon">
        🎉
      </div>

      <div class="success-title">
        衣服登記成功！
      </div>

      <div class="success-text">
        資料已成功送出。<br>
        謝謝你支持 SatayCelup之戰 ❤️
      </div>

      <button
        class="action-btn action-primary"
        id="continueBtn">

        👕 繼續幫其他人買衣服

      </button>

      <a
        href="index.html"
        class="action-btn action-secondary">

    </section>


    <!-- BOTTOM -->

    <div
      class="bottom-actions"
      id="bottomActions">

      <a href="index.html">

      <button

        id="logoutBtn">

  </main>


  <footer>

        googleLoginBtn.disabled = false;

        googleLoginBtn.innerHTML =
          '<span class="google-icon">🌐</span> 使用 Google 登入';

      }

    }
  );


  /* =========================================
     AUTH STATE
  ========================================= */

  onAuthStateChanged(
    auth,
    (user) => {

      if (user) {

        console.log(
          "Google 登入成功：",
          user.email
        );

        loginSection.style.display =
          "none";

        userInfo.style.display =
          "block";

        formSection.style.display =
          "block";

        bottomActions.style.display =
          "flex";

        userName.textContent =
          user.displayName ||
          "Google 使用者";

        userEmail.textContent =
          user.email || "";

      } else {

        loginSection.style.display =
          "block";

        userInfo.style.display =
          "none";

        formSection.style.display =
          "none";

        successSection.style.display =
          "none";

        bottomActions.style.display =
          "none";

      }

    }
  );


  /* =========================================
     SUBMIT
  ========================================= */

  shirtForm.addEventListener(
    "submit",
    async (event) => {

      event.preventDefault();


      const user =
        auth.currentUser;


      if (!user) {

        alert(
          "請先使用 Google 登入。"
        );

        return;

      }


      const chineseName =
        document
          .getElementById(
            "chineseName"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "phone"
          )
          .value
          .trim();


      const shirtText =
        document
          .getElementById(
            "shirtBack"
          )
          .value
          .trim();


      const shirtSizeElement =
        document.querySelector(
          'input[name="shirtSize"]:checked'
        );


      const platinumElement =
        document.querySelector(
          'input[name="platinum"]:checked'
        );


      /* =====================================
         VALIDATION
      ===================================== */

      if (
        !chineseName ||
        !phone ||
        !shirtText ||
        !shirtSizeElement ||
        !platinumElement
      ) {

        alert(
          "請完整填寫所有資料。"
        );

        return;

      }


      const shirtSize =
        shirtSizeElement.value;


      const platinum =
        platinumElement.value;


      /* =====================================
         從 Platinum 名稱取得 UID
      ===================================== */

      const platinumUid =
        PLATINUM_UIDS[platinum];


      if (!platinumUid) {

        alert(
          "這位 Platinum 的系統帳號尚未完成設定，請聯絡管理員。"
        );

        return;

      }


      /* =====================================
         防止錯誤 UID
      ===================================== */

      if (
        !Object.values(
          PLATINUM_UIDS
        ).includes(
          platinumUid
        )
      ) {

        alert(
          "Platinum 系統設定錯誤，請聯絡管理員。"
        );

        return;

      }


      submitBtn.disabled = true;

      submitBtn.textContent =
        "⏳ 正在送出...";


      try {

        /* ===================================
           寫入 Firestore
        =================================== */

        await addDoc(
          collection(
            db,
            "shirtOrders"
          ),
          {

            /* Google 使用者 */

            uid:
              user.uid,

            email:
              user.email || "",

            googleName:
              user.displayName || "",


            /* 衣服資料 */

            chineseName:
              chineseName,

            phone:
              phone,

            shirtSize:
              shirtSize,

            shirtText:
              shirtText,


            /* Platinum 歸屬 */

            platinum:
              platinum,

            platinumUid:
              platinumUid,


            /* 建立時間 */

            createdAt:
              serverTimestamp()

          }
        );


        /* ===================================
           成功畫面
        =================================== */

        formSection.style.display =
          "none";

        userInfo.style.display =
          "none";

        successSection.style.display =
          "block";

        bottomActions.style.display =
          "none";


      } catch (error) {

        console.error(error);

        let errorMessage =
          "送出失敗。";


        if (
          error.code ===
          "permission-denied"
        ) {

          errorMessage +=
            "\n\nFirestore 權限被拒絕。請確認 Firestore Rules 已更新。";

        } else {

          errorMessage +=
            "\n\n" +
            error.message;

        }


        alert(
          errorMessage
        );


        submitBtn.disabled = false;

        submitBtn.textContent =
          "👕 送出衣服訂單";

      }

    }
  );


  /* =========================================
     CONTINUE
  ========================================= */

  continueBtn.addEventListener(
    "click",
    () => {

      shirtForm.reset();

      successSection.style.display =
        "none";

      userInfo.style.display =
        "block";

      formSection.style.display =
        "block";

      bottomActions.style.display =
        "flex";


      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "👕 送出衣服訂單";


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

    }
  );


  /* =========================================
     LOGOUT
  ========================================= */

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

      } catch (error) {

        console.error(error);

        alert(
          "登出失敗：\n" +
          error.message
        );

      }

    }
  );

</script>

</body>
</html>
